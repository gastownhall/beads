version: "2"

run:
  timeout: 5m
  tests: false

linters:
  default: 'none'
  enable:
    - depguard
    - errcheck
    - forbidigo
    - gosec
    - misspell
    - unconvert
    - unparam
    - sloglint

  settings:
    depguard:
      rules:
        # Mechanical enforcement of the Storage Boundary in
        # engdocs/PROJECT_CHARTER.md: only the storage adapter packages may
        # depend on the Dolt engine directly.
        dolt-storage-boundary:
          list-mode: lax
          files:
            - "$all"
            # Storage adapter packages are the intended home for Dolt access.
            - "!**/internal/storage/**"
            - "!**/internal/doltserver/**"
            # Exception: the proxied-server surface needs Dolt server config
            # (servercfg, filesys) to launch/manage a real `dolt sql-server`
            # process. Candidate for migration behind the storage adapter.
            - "!**/cmd/bd/proxied_server.go"
            # Exception: eventkit is DoltHub's analytics/telemetry client,
            # not the Dolt storage engine - dropped here so the narrower
            # dolt-storage-boundary-metrics-exception rule below can allow
            # eventkit specifically while still denying any other dolthub
            # import (e.g. the engine itself) in these two files.
            - "!**/internal/metrics/flusher.go"
            - "!**/internal/metrics/metrics.go"
          deny:
            - pkg: github.com/dolthub
              desc: "Dolt engine access is restricted to the storage adapter packages (internal/storage, internal/doltserver) - see engdocs/PROJECT_CHARTER.md 'Storage Boundary'"
        # Companion rule for the two files excluded above: allow only
        # DoltHub's eventkit telemetry client, still deny the Dolt engine
        # (or any other dolthub package) so metrics can't become a backdoor
        # around the storage boundary.
        dolt-storage-boundary-metrics-exception:
          list-mode: lax
          # No "$all" here: this rule's files list is a plain allowlist
          # (not "!$all" + inclusions) because depguard expands "$all" to
          # "**/*.go" even when negated, which would match every file
          # (including these two) and make the rule apply nowhere.
          files:
            - "**/internal/metrics/flusher.go"
            - "**/internal/metrics/metrics.go"
          allow:
            - github.com/dolthub/eventkit
          deny:
            - pkg: github.com/dolthub
              desc: "Dolt engine access is restricted to the storage adapter packages (internal/storage, internal/doltserver) - see engdocs/PROJECT_CHARTER.md 'Storage Boundary'"
        # internal/workapi is the work-query contract shared by every bd
        # frontend, so it must be callable from a cobra command and from an
        # HTTP handler alike - which means it can depend on neither. Same
        # allowlist shape as the metrics exception above: no "$all", because
        # depguard expands it to "**/*.go" and the rule would apply nowhere.
        workapi-frontend-boundary:
          list-mode: lax
          files:
            - "**/internal/workapi/**"
          deny:
            - pkg: github.com/spf13/cobra
              desc: "internal/workapi is frontend-independent: the CLI parses flags and passes plain params - see internal/workapi/doc.go"
            - pkg: net/http
              desc: "internal/workapi is frontend-independent: the HTTP layer decodes requests and passes plain params - see internal/workapi/doc.go"
        # The other half of that boundary. internal/httpapi is TRANSPORT: it
        # decodes parameters, hands the whole request to issueops.Reader, and
        # shapes the answer onto the wire. "No handler builds a filter or
        # supplies a ConfigSource" is the Reader slice's acceptance criterion,
        # and the rule above cannot enforce it - it constrains what workapi
        # imports, not who imports workapi. Without this, a handler could call
        # BuildListFilter tomorrow and every gate would stay green, which is
        # exactly how a hosted viewer once shipped a bare IssueFilter and served
        # in_progress rows as "ready".
        #
        # Tests are exempt: they read the shared default constants
        # (workapi.DefaultReadyLimit) to prove the handler uses those rather
        # than literals of its own, which is a guard, not a construction.
        httpapi-transport-boundary:
          list-mode: lax
          files:
            - "**/internal/httpapi/**"
            - "!$test"
          deny:
            - pkg: github.com/steveyegge/beads/internal/workapi
              desc: "internal/httpapi is transport only: a read handler asks the provider for issueops.Reader and passes the whole request - it never builds a filter - see internal/httpapi/reads.go"
        # The OTHER way past the roles, and the one the rule above does not
        # close. Denying internal/workapi stops a handler BUILDING a filter; it
        # does nothing about a handler taking uw.IssueUseCase() and calling the
        # use case straight, which needs no filter and no builder. That is not a
        # hypothetical shortcut - it is exactly what the proxied CLI did for
        # years, and unpicking it is what the role accessors exist for. A second
        # front door that reached the domain directly would be the same two
        # implementations again, arriving one handler at a time.
        #
        # Deny-by-default over the whole package, so a file added here tomorrow
        # is covered the moment it exists. The two holes below are named, and
        # each one is a VALUE the caller assembled, never a use case:
        #
        #   server.go     Config.Workspace is domain.ContextInfo, the startup
        #                 snapshot the embedder hands in. The package resolves
        #                 no workspace state of its own; this is the type of the
        #                 thing it is given.
        #   handlers.go   contextResponse projects that snapshot with
        #                 domain.PublishedContext - the SAME projection `bd
        #                 context` publishes, which is where the credential and
        #                 host-path exclusions live. Reimplementing it here to
        #                 satisfy a lint rule would be the field-by-field copy
        #                 that projection exists to prevent.
        #
        # Neither file touches a use case, and both are small: the read handlers
        # (reads.go), the one write (claim.go) and everything added later stay
        # guarded. Tests are exempt for the reason the rule above exempts them -
        # they stand up domain fakes to drive the handlers.
        httpapi-domain-boundary:
          list-mode: lax
          files:
            - "**/internal/httpapi/**"
            - "!$test"
            - "!**/internal/httpapi/server.go"
            - "!**/internal/httpapi/handlers.go"
          deny:
            - pkg: github.com/steveyegge/beads/internal/storage/domain
              desc: "internal/httpapi is transport only: a handler reaches storage through an issueops role accessor on the provider, never through the domain use cases - see internal/httpapi/claim.go"
        # store.IssueReader() is the door to the reader role, and a store wears
        # decorators (telemetry spans, hook firing) that each add their layer in
        # their OWN accessor. A command holding the storage.DoltStorage
        # interface that called the shared constructor directly would get a
        # bare, unspanned reader - and would look like perfectly ordinary code.
        # That constructor used to live in internal/workapi, which 22 cmd/bd
        # files already import for the builders, so it was one line away at all
        # times. It now lives in internal/workapi/storereader and this is what
        # keeps it there.
        #
        # No matching entry for internal/httpapi: depguard matches pkg by
        # prefix, so httpapi-transport-boundary above already denies the
        # subpackage along with its parent.
        #
        # The list grows by one entry per store-backed role that gets a shared
        # body of its own. It is a LIST rather than a rule per role so the next
        # one is a one-line edit here - see
        # engdocs/ADDING_AN_ISSUEOPS_ROLE.md.
        cmd-bd-role-constructors:
          list-mode: lax
          files:
            - "**/cmd/bd/**"
          deny:
            - pkg: github.com/steveyegge/beads/internal/workapi/storereader
              desc: "a command reaches the reader role through store.IssueReader(), never through the constructor: the accessor is where each storage decorator adds its layer - see internal/workapi/storereader/reader.go"
            - pkg: github.com/steveyegge/beads/internal/workapi/storecounter
              desc: "a command reaches the count role through store.Counter(), never through the constructor: the accessor is where each storage decorator adds its layer - see internal/workapi/storecounter/counter.go"
            - pkg: github.com/steveyegge/beads/internal/workapi/storeworkspaceconfig
              desc: "a command reaches the workspace-settings role through store.WorkspaceConfig(), never through the constructor: the accessor is where each storage decorator adds its layer - see internal/workapi/storeworkspaceconfig/workspaceconfig.go"
            - pkg: github.com/steveyegge/beads/internal/workapi/storeversionreconciler
              desc: "a command reaches the version-marker role through store.VersionReconciler(), never through the constructor: the accessor is where each storage decorator adds its layer - see internal/workapi/storeversionreconciler/versionreconciler.go"
            - pkg: github.com/steveyegge/beads/internal/workapi/storestats
              desc: "a command reaches the summary role through store.StatsReporter(), never through the constructor: the accessor is where each storage decorator adds its layer - see internal/workapi/storestats/reporter.go"
            - pkg: github.com/steveyegge/beads/internal/workapi/storereadycounter
              desc: "a command reaches the ready-count role through store.ReadyCounter(), never through the constructor: the accessor is where each storage decorator adds its layer - see internal/workapi/storereadycounter/counter.go"
            - pkg: github.com/steveyegge/beads/internal/workapi/storequerier
              desc: "a command reaches the boolean-query role through store.Querier(), never through the constructor: the accessor is where each storage decorator adds its layer - see internal/workapi/storequerier/querier.go"
        # beadserrors sits BENEATH every role leaf, so whatever it imports is
        # imported by all of them - which is the reason it exists. The second
        # leaf reached into issueops for one sentinel and pulled internal/types
        # along behind it, and that import claimed the memory plane sits
        # downstream of the issue plane. Stdlib only, and enforced rather than
        # requested, because the next tempting import is always one shared
        # constant that "obviously belongs with the errors".
        #
        # strict, not lax: this is an allowlist of the whole world, so a rule
        # that named packages to deny would have to predict them.
        beadserrors-leaf:
          list-mode: strict
          files:
            - "**/beadserrors/**"
          allow:
            - "$gostd"
    # The CONSTRUCTION half of that same boundary, and the half that actually
    # matches the failure. The depguard rule above denies a handler IMPORTING
    # the builders; it does not deny a handler naming the filter types, which
    # internal/httpapi can already reach (reads.go uses types.CheckFieldLen and
    # types.IssueWithCounts). A hand-rolled `types.IssueFilter{}` would skip the
    # builders entirely and still lint clean - which is EXACTLY what the hosted
    # viewer shipped: a bare IssueFilter that leaked gates, wisps, templates and
    # closed beads that `bd list` hides.
    #
    # analyze-types resolves the selector to the type it actually denotes, so
    # an aliased import of internal/types is caught and an unrelated package
    # that happens to be called `types` is not.
    #
    # WHAT THE RULE FORBIDS IS NAMING THESE TYPES - a composite literal, a var,
    # a struct field, a parameter, a return. It does not forbid HOLDING one:
    # `filter, err := workapi.BuildListFilter(...)` names no type and passes,
    # which is the point, but so would an inferred assignment from any other
    # source, including a helper in one of the excepted files below. So the
    # rule forecloses WRITING a filter in scope - which is what hand-rolling
    # looks like - and it is not a proof that every filter in scope came from a
    # builder. That is still the difference that matters: the builder is where
    # the closed/done exclusions, the template, gate, infra and wisp
    # suppression and the limit defaulting live.
    #
    # SCOPE, set by the exclusion rules near the bottom of this file:
    #
    #   internal/httpapi/**  every file, no exceptions. Each read handler hands
    #                        the whole request to issueops.Reader and the
    #                        surface has no other job, so a file added here
    #                        tomorrow is covered the moment it exists.
    #   cmd/bd/**            DENY BY DEFAULT, with the files that legitimately
    #                        build a filter named as exceptions below. This is
    #                        the way round that survives a rename: `bd list`
    #                        split into a new helper, or show.go renamed, stays
    #                        guarded. An inclusion list of five filenames -
    #                        which is what this was - stops applying the moment
    #                        the code moves, silently.
    #
    # Nothing else in the tree is in scope, deliberately: there are ~750
    # legitimate filter literals in storage, the domain, conformance and the
    # tests, and a tree-wide ban is not the claim.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^types\.(IssueFilter|WorkFilter)$'
          pkg: '^github\.com/steveyegge/beads/internal/types$'
          msg: "do not write a filter here: take one back from a builder in internal/workapi, or pass the whole request to issueops.Reader. internal/httpapi may never name these types; cmd/bd denies them by default and lists the files that legitimately build their own, with the reason for each, in .golangci.yml - see issueops/reader.go"
    errcheck:
      exclude-functions:
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.Stmt).Close
        - (*database/sql.Conn).Close
        - (*os.File).Close
        - (os).RemoveAll
        - (os).Remove
        - (os).Setenv
        - (os).Unsetenv
        - (os).Chdir
        - (os).MkdirAll
        - (fmt).Sscanf
        - (fmt).Fprint
        - (fmt).Fprintf
        - (fmt).Fprintln
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    misspell:
      locale: US

  exclusions:
    rules:
      # forbidigo holds exactly one rule - the filter-construction guard - and
      # the entries from here to the test exemption are its entire scope. This
      # one keeps it off the rest of the tree; the settings block above says
      # why. A second forbidigo rule would need this widened or replaced, and
      # nothing else about the config would tell you that, so it is written
      # here rather than left implicit.
      - path-except: '^(internal/httpapi/|cmd/bd/)'
        linters:
          - forbidigo
      # Inside cmd/bd the rule is deny-by-default, so each entry below is a
      # HOLE in it and carries the reason that hole exists. 59 of the 389
      # non-test files under cmd/bd are on this list; widening it is an edit
      # here and a diff a reviewer sees. internal/httpapi has no entry and is
      # meant not to.
      #
      # The modes of `bd list` and `bd show` that consume the filter as a
      # VALUE: the recursive --parent tree walk (it re-parents a copy at every
      # level), the --watch poll loop, the proxied route's builder call (it has
      # to name the type to hand the filter back), and --current (which
      # resolves an id from a deliberately BARE filter that must not pick up
      # the default listing's exclusions).
      #
      # `bd list`'s PAGE left this hole when issueops.Reader took it on both
      # routes: cmd/bd/list.go and cmd/bd/list_proxied_server.go were never on
      # this list and still are not, and the modes above are all that keeps this
      # file on it. The entry therefore stays and the count is unchanged — a
      # role commit that could not remove one says so rather than implying it.
      - path: '^cmd/bd/list_show_filter_modes\.go$'
        linters:
          - forbidigo
      # `bd ready` hands its filter to the plain listing and to --claim, and
      # readyInput carries it as a field for them. Routing only the listing
      # through the role would fork the command in two, so the filter stays
      # nameable here. The other modes take no filter from readyInput: --gated
      # and --mol answer a different question and short-circuit before the
      # flags are gathered, and so does --explain, which is a whole-graph
      # diagnostic and therefore builds its own fixed request through the same
      # builder (readyExplainFilter, which names the type it returns) rather
      # than inlining a third copy of the default - bd-3fs.3. The blocked-issue
      # views in these files name the type directly for an empty filter or one
      # carrying only a --parent id, which is the absence of a filter rather
      # than one this command built. `bd ready`'s LISTING is on the shared
      # BUILDER and, on the proxied route, the shared EPILOGUE; it is not on a
      # role, and this rule does not pretend otherwise. Its other two questions
      # are: --claim goes to ReadyClaimer and the published total to
      # ReadyCounter, both over the request rather than the filter, on both
      # routes - which is why this hole keeps shrinking rather than growing.
      - path: '^cmd/bd/ready(_input|_proxied_server)?\.go$'
        linters:
          - forbidigo
      # Everything below this point is a command that is NOT one of the three
      # shared reads. Each asks storage its own question and builds the filter
      # that question needs; none is on the reader role or claims to be. They
      # are grouped by family only so the reasons stay readable - every file is
      # still named, and a new file in a family is still an edit here.
      #
      # Commands with a direct route and a proxied twin that build the same
      # filter on both.
      #
      # `status` LEFT this list when the StatsReporter role took the assignee
      # filter, the ready-work filter and the status fold off both its routes:
      # cmd/bd/status.go and cmd/bd/status_proxied_server.go now build an
      # issueops request and name no filter type, so the hole they needed is
      # closed rather than merely unused. Removing an entry here is how a role
      # commit proves its front doors reached the role.
      #
      # `purge` left it the same way when the Sweeper role took the candidate
      # filter off both `bd purge` and `bd prune`: cmd/bd/purge.go now builds an
      # issueops.SweepRequest, and cmd/bd/purge_proxied_server.go is down to the
      # provider's capability accessor. `gc` stays — it is a different command
      # that still selects its own closed beads, and it now shares only the pure
      # recheck (workapi.FilterSweepCandidates) with the role.
      - path: '^cmd/bd/(close|duplicates|find_duplicates|gate|gc|graph|info|label|orphans|purge|search|todo|wisp|human)(_proxied_server)?\.go$'
        linters:
          - forbidigo
      # Molecule reporting: each selects the members of one molecule.
      - path: '^cmd/bd/mol_(current|port|progress|ready_gated|stale)\.go$'
        linters:
          - forbidigo
      # External-tracker sync: each selects the beads to push to its tracker.
      - path: '^cmd/bd/(ado|gitlab|jira|linear)\.go$'
        linters:
          - forbidigo
      # Bulk movement of issues in, out and across prefixes. export_source is
      # export's storage seam (classic store vs proxied unit of work): it does
      # not build a filter, it carries the one export.go builds through to
      # whichever stack is live.
      - path: '^cmd/bd/(export|export_auto|export_source|import|migrate|migrate_issues|migrate_personal|rename|rename_prefix)\.go$'
        linters:
          - forbidigo
      # doctor's diagnostics and the fixes that follow them.
      - path: '^cmd/bd/doctor_(conventions|pollution)\.go$|^cmd/bd/doctor/(maintenance|fix/maintenance|fix/migrate)\.go$'
        linters:
          - forbidigo
      # One command each, no family to join.
      #
      # `count` LEFT this list when the Counter role took the filter off both
      # its routes: cmd/bd/count.go now builds an issueops.CountRequest and
      # names no filter type, so the hole it needed is closed rather than
      # merely unused. Removing an entry here is how a role commit proves its
      # front door reached the role.
      
      - path: '^cmd/bd/(cleanup|completions|gate_discover|lint|ping|repo|swarm|template)\.go$'
        linters:
          - forbidigo
      # Tests are exempt for the same reason the depguard twin exempts them:
      # recordingIssues in reads_test.go holds []types.WorkFilter and
      # []types.IssueFilter to CAPTURE what the reader asked storage for, which
      # is how the guard is checked, not a construction. `run.tests: false`
      # already means this never fires - this is here so flipping that switch
      # does not turn the guard into a landmine on its own oracle.
      - path: '_test\.go'
        linters:
          - forbidigo
      # G304: File inclusion via variable in tests is safe (test data)
      - path: '_test\.go'
        linters:
          - gosec
        text: "G304"
      # G306: File permissions 0644 in tests are acceptable (test fixtures)
      - path: '_test\.go'
        linters:
          - gosec
        text: "G306"
      # G304: Safe file reads from known JSONL and error paths
      - path: 'cmd/bd/doctor/fix/sync_branch\.go|cmd/bd/doctor/git\.go|cmd/bd/doctor/sync_branch_jsonl\.go|cmd/bd/dolt\.go|cmd/bd/rename_prefix\.go|internal/beads/beads\.go|internal/syncbranch/worktree\.go'
        linters:
          - gosec
        text: "G304"
      # G302/G306: Directory/file permissions 0700/0750 are acceptable
      - linters:
          - gosec
        text: "G302.*0700|G301.*0750"
      # G302/G306: JSONL files and error logs need 0644 for debugging/sharing
      - path: 'cmd/bd/setup\.go|internal/git/worktree\.go'
        linters:
          - gosec
        text: "G306"
      # G306: Git hooks must be executable (0700)
      - path: 'cmd/bd/init\.go'
        linters:
          - gosec
        text: "G306.*0700"
      # G204: Subprocess launched with variable — all subprocess args are from
      # trusted internal sources (git commands, config values, validated IDs)
      - linters:
          - gosec
        text: 'G204'
      # G104: Deferred file/db closes - errors are non-critical
      - path: 'cmd/bd/show\.go|cmd/bd/doctor/dolt\.go'
        linters:
          - gosec
        text: "G104"
      # G115: Integer overflow conversion uintptr->int in terminal fd wrappers (safe on 64-bit)
      - linters:
          - gosec
        text: "G115"
      # G117: Exported struct fields matching secret patterns are intentional API fields
      - path: 'internal/compact/compactor\.go|internal/jira/client\.go|internal/linear/types\.go|internal/linear/oauth\.go|internal/storage/versioned\.go'
        linters:
          - gosec
        text: "G117"
      # G304: Safe file reads from config paths
      - path: 'internal/config/config\.go'
        linters:
          - gosec
        text: "G304"
      # G306: Config file permissions 0644 are acceptable
      - path: 'internal/config/config\.go'
        linters:
          - gosec
        text: "G306"
      # G703: Path traversal via taint — paths are from config or internal construction
      - linters:
          - gosec
        text: "G703"
      # G704: SSRF via taint in API clients with user-configured URLs
      - path: 'cmd/bd/doctor/(claude|version)\.go|internal/github/client\.go|internal/gitlab/client\.go|internal/jira/client\.go|internal/linear/client\.go|internal/linear/oauth\.go'
        linters:
          - gosec
        text: "G704"
      # G705: XSS via taint in CLI template rendering (no browser context)
      - path: 'cmd/bd/compact\.go|internal/linear/client\.go'
        linters:
          - gosec
        text: "G705"
      # G705: XSS via taint in CLI progress/warning/error output — every flagged
      # sink is fmt.Fprint* to the terminal (os.Stderr or cobra's stdout/stderr
      # writers), never a browser context (surfaced by the gosec bundled with
      # golangci-lint v2.10)
      - path: 'cmd/bd/(ado|doctor|errors|github|gitlab|hooks|jira|linear|main|notion|sync_push_pull)\.go'
        linters:
          - gosec
        text: "G705"
      # errcheck: fmt.Fprintf errors are noise in CLI help text generation
      - path: 'cmd/bd/help_all\.go'
        linters:
          - errcheck
        text: "fmt.Fprintf"
      # errcheck: Ignore unchecked errors in test files for common cleanup patterns
      - path: '_test\.go'
        linters:
          - errcheck
        text: "Error return value of .*(Close|Rollback|RemoveAll|Setenv|Unsetenv|Chdir|MkdirAll|Remove|Write|SetReadDeadline|SetDeadline|Start|Stop).* is not checked"

      # unparam: Placeholder functions that may return errors in future implementation
      - path: 'cmd/bd/jira\.go'
        linters:
          - unparam
        text: 'reimportConflicts|resolveConflictsByTimestamp'
      # unparam: childrenMap return computed for future parent-child display
      - path: 'cmd/bd/list\.go'
        linters:
          - unparam
        text: 'buildBlockingMaps.*childrenMap'
      # unparam: truncateID maxLen kept for readability
      - path: 'cmd/bd/migrate\.go'
        linters:
          - unparam
        text: 'truncateID.*maxLen'
      # unparam: getConfig error return kept for API consistency with store.GetConfig
      - path: 'internal/(linear|gitlab|jira)/tracker\.go'
        linters:
          - unparam
        text: 'getConfig'
      # unparam: ctx kept for context propagation; callers currently all pass rootCtx
      - path: 'cmd/bd/linear\.go'
        linters:
          - unparam
        text: 'getLinearConfig'
      # misspell: "cancelled" is intentional - matching GitHub API response values
      - path: 'cmd/bd/gate\.go'
        linters:
          - misspell
        text: 'cancelled'

issues:
  uniq-by-line: true
