repos:
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.10.1
    hooks:
      - id: golangci-lint
        # Mirror the ci-pr-lint gate's config and build tags
        # (scripts/ci/pr-lint.sh). Scope and the gate's Windows cross-lint
        # pass still differ.
        args:
          - --config=.golangci.yml
          - --modules-download-mode=readonly
          - --timeout=5m
          - --build-tags=gms_pure_go

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
