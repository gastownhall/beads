# third_party/bdp/spec/ is vendored byte for byte from gastownhall/bdp and
# locked by third_party/bdp/bdp.pin: the whitespace and end-of-file fixers
# would rewrite it, and a pin bump may add files over check-added-large-files'
# 500 KB limit. scripts/bdp-vendor.sh is the only writer.
exclude: ^third_party/bdp/spec/

repos:
  # Lint and vet: nogo (//tools/nogo) over the changed files' Bazel packages,
  # the analyzers CI gates on (go test's vet checks plus the golangci-lint
  # linters .golangci.yml enables). Needs bazel or bazelisk on PATH.
  - repo: local
    hooks:
      - id: nogo
        name: nogo (bazel)
        entry: make lint-changed LINT_CHANGED_SCOPE=staged
        language: system
        types: [go]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
