# The bd connect front door (G3): what every runnable command in
# cmd/bd/testdata/command_tree/tree.golden does on a workspace attached to a
# bd serve with `bd connect`, recorded as it is on main.
#
# TestConnectFrontDoorClassifiesEveryCommand (test lane, connect_front_door_test.go)
# fails on a runnable command with no row, a row for a command tree.golden no
# longer lists, a malformed case, a ledger citation that does not resolve, and
# a live F- ledger row that no case pins. TestE2E_ConnectFrontDoorMatrixPart1..N
# (embedded lane, e2e_connect_front_door_test.go) run every case.
#
# A row is one command path. It has cases, or a class and a reason:
#   local-only      not run: the command reads and writes no issue-store data
#                   through the backend (help, local files, local processes).
#                   It may still open the store, which over connect is one
#                   GET /v0/beads/context handshake; a reason that says "never
#                   opens the issue store" means the command is exempt from
#                   bd's store gate (noDbCommands or bd:skip_store), and one
#                   that says "opens the store" names the handshake.
#   pending-ruling  not run: the matrix cannot run it (a tracker's network, a
#                   TTY). This count may only shrink (maxUnrunPendingRulings).
# A case is one argv with one class:
#   works           the served run and the embedded twin's run both exit
#                   `exit` (default 0) and print the same stdout under
#                   `compare` (json, the default; text; lines; exit), after
#                   revisions and `ignore_fields` are dropped and timestamps
#                   are scrubbed: when each side wrote does not count, but a
#                   zeroed or missing stamp does, and a deadline (defer_until,
#                   due_at) is compared as it is, so a case sets one to an
#                   absolute date; then every `verify` read answers the same
#                   JSON on both sides.
#                   `expect_stdout` also holds the served stdout to a regexp.
#   refuses         the served run exits `exit` (nonzero); its stderr, stdout
#                   and the string members of any JSON object they carry match
#                   `words` (and carry a JSON `code`, when one is given); and it
#                   writes nothing: not the server's store (its HEAD, its
#                   working-set status, and, by content, its config table and
#                   its dolt_ignore'd wisps with their labels, which status
#                   cannot see; its other dolt_ignore'd tables, such as events,
#                   leases and the wisps' dependencies and comments, are not
#                   compared) and not the workspace's .beads. The same argv on an
#                   embedded oracle exits `embedded_exit` (default 0), so a
#                   refusal is the backend's and not a broken argv; a case whose
#                   oracle exit would depend on other cases sets skip_embedded
#                   and says why in `note`.
#   pending-ruling  today's served behavior, pinned while the decision that
#                   changes it is open (`ruling`): `observed` holds the exit (or
#                   `listens`: the command serves until stopped), regexps the
#                   stdout and stderr must and must not match, and `writes`:
#                   none (as refuses), or local (.beads may change, the
#                   server's store may not; needs fresh).
#
# Placeholders: {file:NAME} is that side's copy of asset NAME ({file:.} its
# assets directory). An asset with install_to is also copied to that path in
# both workspaces. seed runs on both sides after attach; seed_kv keys go into
# the server's store directly (bd kv set refuses over connect) and through bd kv
# set on the embedded sides.
#
# Each part attaches its own server, served workspace, embedded twin and
# embedded oracle, and seeds all three. The served side and the twin receive
# exactly the same works cases, and refuses and pending-ruling cases never
# write either (checked), so the two stay identical and a case's order in its
# part cannot change a comparison. A `fresh` case runs in its own unseeded pair
# (a works case gets its own server too): for commands that rewrite the
# workspace itself, and for a works case whose minted ids would otherwise reach
# every later whole-store read.
#
# Flipping cases is how a native fix proves itself: its PR changes exactly the
# cases its decision record names (native_fix: B1-B16, C1, D1-D8, E1-E4) and
# their ledger citations, and nothing else.

