    install_to: .beads/formulas/fd-check.formula.toml
    content: |
      formula = "fd-check"
      description = "front door formula"
      version = 1
      type = "workflow"

      [[steps]]
      id = "one"
      title = "Step one"
      description = "first"

      [[steps]]
      id = "two"
      title = "Step two"
      needs = ["one"]
