        observed: {exit: 0, stdout: e2e-fdreply, stdout_absent: '(?s)"created_by".*"created_by"', writes: none}
      - id: show-refs
        class: pending-ruling
        native_fix: [D6]
        ledger: [F-show-refs]
        ledger_drift: F-show-refs says the flag refuses; it answers shallow rows
        ruling: 'D6: over connect --refs answers shallow rows (no created_by, zeroed fields); D6 hydrates them through batchGetIssues'
        args: [show, e2e-fdalpha, '--refs', '--json']
        observed: {exit: 0, stdout: e2e-fdblocked, stdout_absent: '"created_by"', writes: none}
      - id: show-children
        class: pending-ruling
        native_fix: [D6]
        ledger: [F-show-children]
        ledger_drift: F-show-children says the flag refuses; it answers shallow rows
        ruling: 'D6: over connect --children answers shallow rows; D6 hydrates them'
        args: [show, e2e-fdepic, '--children', '--json']
        observed: {exit: 0, stdout: e2e-fdepic\.1, stdout_absent: '"created_by"', writes: none}
      - id: show-as-of
        class: refuses
        native_fix: [E4]
        args: [show, e2e-fdalpha, '--as-of', HEAD, '--json']
        exit: 1
        words: 'operation "AsOf" not supported by the http backend'
      - id: show-partial-id
        class: refuses
        ledger: [F-partial-id]
        note: the embedded oracle resolves the partial id to e2e-fdalpha
        args: [show, e2e-fdalp, '--json']
        exit: 1
        words: Issue e2e-fdalp not found
