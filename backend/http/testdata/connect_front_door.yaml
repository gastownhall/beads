      {"nodes": [{"key": "g", "id": "e2e-ngraph", "title": "FD graph root", "type": "epic"}, {"key": "g.1", "id": "e2e-ngraph.1", "title": "FD graph step", "type": "task", "parent_key": "g"}]}
