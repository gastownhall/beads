seed:
  - [create, '--graph', '{file:seed.json}', '--json']
  - [update, e2e-fdalpha, e2e-fdmol.1, e2e-theartbeat, e2e-tunclaim, '--status', in_progress]
  - [close, '--force', e2e-fdclosed, e2e-fdepic.2, e2e-treopen, e2e-tsquash.1, e2e-tship]
  - [comments, add, e2e-fdalpha, seed comment]
  - [dep, add, e2e-tunrel1, e2e-tunrel2, '--type', relates-to]
  - [remember, FD insight, '--key', fdmem]

seed_kv:
  - {key: fd.key, value: fd-value}

commands:
  - command: bd
    class: local-only
    reason: the root command prints help; never opens the issue store
  - command: bd admin cleanup
    cases:
      - id: admin-cleanup
        class: refuses
        note: 'the words name embedded mode, which a connect workspace is not (the defect E1 fixes for bd sql)'
        args: [admin, cleanup, '--dry-run', '--json']
        exit: 1
        words: '''bd admin cleanup'' is not yet supported in embedded mode'
        embedded_exit: 1
  - command: bd admin compact
    cases:
      - id: admin-compact
        class: refuses
        args: [admin, compact, '--stats', '--json']
        exit: 1
        words: 'operation "GetTier1Candidates" not supported by the http backend'
  - command: bd admin reset
    cases:
      - id: admin-reset
        class: refuses
        fresh: true
        note: 'fresh: a reset that ever succeeded would take the part''s served workspace with it; the words name embedded mode, which a connect workspace is not'
        args: [admin, reset, '--json']
        exit: 1
        words: '''bd admin reset'' is not yet supported in embedded mode'
        embedded_exit: 1
  - command: bd ado projects
    class: pending-ruling
    reason: 'tracker integration: it needs a configured Azure DevOps project and its network API, which no test lane has, so its behavior over bd connect is unexercised'
  - command: bd ado pull
    class: pending-ruling
    reason: 'tracker integration: it needs a configured Azure DevOps project and its network API, which no test lane has, so its behavior over bd connect is unexercised'
  - command: bd ado push
    class: pending-ruling
    reason: 'tracker integration: it needs a configured Azure DevOps project and its network API, which no test lane has, so its behavior over bd connect is unexercised'
  - command: bd ado status
    cases:
      - id: ado-status
        class: works
        args: [ado, status, '--json']
  - command: bd ado sync
    class: pending-ruling
    reason: 'tracker integration: it needs a configured Azure DevOps project and its network API, which no test lane has, so its behavior over bd connect is unexercised'
  - command: bd assign
    cases:
      - id: assign
        class: works
        args: [assign, e2e-tassign, bob, '--json']
        verify: [[show, e2e-tassign, '--json']]
  - command: bd audit label
    class: local-only
    reason: 'opens the store (the context handshake), then labels an entry of the workspace-local .beads/interactions.jsonl audit sidecar; writes no the issue store'
  - command: bd audit record
    cases:
      - id: audit-record
        class: works
        note: 'appends to the workspace-local .beads/interactions.jsonl audit sidecar; it opens the store (the context handshake) first'
        env: [BD_AUDIT_ENABLED=1]
        args: [audit, record, '--kind', tool_call, '--tool-name', fd-front-door, '--exit-code', '0']
        compare: exit
  - command: bd backup init
    cases:
      - id: backup-init
        class: refuses
        note: 'the embedded oracle''s backup state depends on the other backup cases'
        args: [backup, init, '{file:backup-dir}']
        exit: 1
        words: storage backend does not support backup operations
        skip_embedded: true
  - command: bd backup remove
    cases:
      - id: backup-remove
        class: refuses
        note: 'the embedded oracle''s backup state depends on the other backup cases'
        args: [backup, remove, '--json']
        exit: 1
        words: storage backend does not support backup operations
        skip_embedded: true
  - command: bd backup restore
    cases:
      - id: backup-restore
        class: refuses
        note: 'the embedded oracle''s backup state depends on the other backup cases'
        args: [backup, restore, '{file:.}', '--json']
        exit: 1
        words: storage backend does not support backup operations
        skip_embedded: true
  - command: bd backup status
    cases:
      - id: backup-status
        class: works
        note: a connect workspace has no local database to size
        args: [backup, status, '--json']
        ignore_fields: [database_size]
  - command: bd backup sync
    cases:
      - id: backup-sync
        class: refuses
        note: 'the embedded oracle''s backup state depends on the other backup cases'
        args: [backup, sync, '--json']
        exit: 1
        words: storage backend does not support backup operations
        skip_embedded: true
  - command: bd batch
    cases:
      - id: batch
        class: refuses
        native_fix: [B11]
        args: [batch, '-f', '{file:batch.txt}', '--json']
        exit: 1
        words: 'operation "RunInTransaction" not supported by the http backend'
        code: batch_error
  - command: bd blocked
    cases:
      - id: blocked
        class: works
        args: [blocked, '--json']
  - command: bd bootstrap
    cases:
      - id: bootstrap
        class: refuses
        args: [bootstrap, '--json']
        exit: 1
        words: 'backend "http" cannot be bootstrapped by bd bootstrap'
  - command: bd branch
    cases:
      - id: branch-list
        class: refuses
        args: [branch, '--json']
        exit: 1
        words: 'operation "ListBranches" not supported by the http backend'
  - command: bd children
    cases:
      - id: children
        class: works
        args: [children, e2e-fdepic, '--json']
  - command: bd close
    cases:
      - id: close
        class: works
        args: [close, e2e-tclose, '--json']
        verify: [[show, e2e-tclose, '--json']]
      - id: close-claim-next
        class: refuses
        native_fix: [B10]
        ledger: [F-close]
        args: [close, e2e-tclaimnext, '--claim-next', '--json']
        exit: 1
        words: 'the served batch close cannot carry a next claim, so nothing was closed'
  - command: bd codex-hook
    cases:
      - id: codex-hook-session-start
        class: works
        stdin: '{}'
        args: [codex-hook, SessionStart]
  - command: bd comment
    cases:
      - id: comment
        class: works
        args: [comment, e2e-tcomment, hello, '--json']
        ignore_fields: [id]
        verify: [[comments, e2e-tcomment, '--json']]
  - command: bd comments
    cases:
      - id: comments
        class: works
        note: comment ids are minted per workspace
        args: [comments, e2e-fdalpha, '--json']
        ignore_fields: [id]
  - command: bd comments add
    cases:
      - id: comments-add
        class: works
        args: [comments, add, e2e-tcomments, hello there, '--json']
        ignore_fields: [id]
        verify: [[comments, e2e-tcomments, '--json']]
  - command: bd comments list
    cases:
      - id: comments-list
        class: works
        note: 'a stub that always exits 1 pointing at bd comments <issue-id>; it never opens the store (no request)'
        args: [comments, list]
        exit: 1
        compare: text
  - command: bd compact
    cases:
      - id: compact
        class: refuses
        args: [compact, '--dry-run', '--json']
        exit: 1
        words: 'operation "Log" not supported by the http backend'
  - command: bd completion bash
    class: local-only
    reason: prints a shell completion script; never opens the issue store
  - command: bd completion fish
    class: local-only
    reason: prints a shell completion script; never opens the issue store
  - command: bd completion powershell
    class: local-only
    reason: prints a shell completion script; never opens the issue store
  - command: bd completion zsh
    class: local-only
    reason: prints a shell completion script; never opens the issue store
  - command: bd config apply
    class: local-only
    reason: 'opens the store (the context handshake), then reconciles the local checkout (git hooks, Dolt remotes) with config.yaml; no issue-store state'
  - command: bd config drift
    class: local-only
    reason: 'opens the store (the context handshake), then inspects the local checkout (git hooks, Dolt remotes) against config.yaml; no issue-store state. Not a works case: its checks read how each workspace was attached, not the backend (the embedded twin reports missing git hooks and exits 1; the served workspace reports no git repository and exits 0)'
  - command: bd config get
    cases:
      - id: config-get
        class: works
        args: [config, get, issue_prefix, '--json']
  - command: bd config list
    cases:
      - id: config-list
        class: works
        args: [config, list, '--json']
  - command: bd config set
    cases:
      - id: config-set
        class: works
        args: [config, set, fd.set, x, '--json']
        verify: [[config, get, fd.set, '--json']]
  - command: bd config set-many
    cases:
      - id: config-set-many
        class: refuses
        note: bd config set works over connect; set-many refuses
        args: [config, set-many, fd.many=y, '--json']
        exit: 1
        words: 'operation "SetConfig" not supported by the http backend'
  - command: bd config show
    cases:
      - id: config-show
        class: works
        note: 'a connect workspace has no metadata.json-sourced keys (dolt_mode, dolt_database, project_id) and here no git checkout (beads.role)'
        args: [config, show, '--json']
        compare: exit
        expect_stdout: '"key": "issue_prefix"'
  - command: bd config unset
    cases:
      - id: config-unset
        class: works
        setup: [[config, set, fd.unset, x]]
        args: [config, unset, fd.unset, '--json']
        verify: [[config, get, fd.unset, '--json']]
  - command: bd config validate
    cases:
      - id: config-validate
        class: works
        note: 'the embedded side also checks federation.remote, which only a Dolt workspace has'
        args: [config, validate, '--json']
        compare: exit
        expect_stdout: '"valid": true'
  - command: bd conflicts list
    cases:
      - id: conflicts-list
        class: refuses
        args: [conflicts, list, '--json']
        exit: 1
        words: 'operation "GetConflicts" not supported by the http backend'
  - command: bd conflicts resolve
    cases:
      - id: conflicts-resolve
        class: refuses
        args: [conflicts, resolve, '--all', '--ours', '--json']
        exit: 1
        words: 'operation "GetConflicts" not supported by the http backend'
  - command: bd conflicts show
    cases:
