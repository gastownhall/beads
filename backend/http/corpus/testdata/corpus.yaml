# Served command corpus (slice S23): every distinct bd command shape the
# orchestrator (gc) and its packs/formulas issue against a work store.
#
# Sources:
#   gc:  gascity origin/main internal/beads/bdstore*.go, internal/config/workquery.go,
#        cmd/gc (BdStore subprocess shapes, work_query/scale_check/on_boot/on_death
#        shell, hook claim, agent-script actions, doctor/preflight probes).
#   mc:  pack, formula, prompt and script invocations counted across the
#        maintainer packs (flag sets, not values; values here are representative).
#
# Each shape runs on a served workspace (bd connect to an in-process bd serve,
# non-loopback bind mode, bearer auth, masked to testdata/reference_server.json)
# and on an embedded workspace, with BEADS_ACTOR=worker and CLAUDE_SESSION_ID set
# on both. See README.md for the fields. Reads come first; writes after them
# each own their target ids (e2e-t-*), so write order never changes a read.
# The shapes are dealt round robin, in this order, across the suite's parts,
# and each part seeds its own workspaces: a shape may rely on the seed and its
# own setup, never on another shape having run.
#
# pending: {slice, reason} marks a known failure. The shape still runs; when it
# passes the subtest FAILS until the mark is removed. That is how a slice proves
# itself. Permanent refusals live in allowlist.yaml instead.

