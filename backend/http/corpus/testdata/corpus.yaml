  # gate check lists the open gates through the same ListGates entry. No
  # seeded gate carries an await type (the seed graph carries no gate members;
  # mc-gate-check-timer-resolves below creates a real timer gate), so the
  # typed sweeps find nothing of their type and the untyped one lists the open
  # gates and evaluates none: the listing is what these shapes prove served,
  # and nothing resolves, escalates (no gt exec) or writes.
  - id: mc-gate-check-timer
