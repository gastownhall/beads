        {"key": "t-l", "id": "e2e-t-l", "title": "target l", "type": "task"},
        {"key": "t-as2", "id": "e2e-t-as2", "title": "target as2", "type": "task"},
        {"key": "t-cm", "id": "e2e-t-cm", "title": "target cm", "type": "task"},
        {"key": "t-rel", "id": "e2e-t-rel", "title": "target rel", "type": "task", "assignee": "worker"},
        {"key": "t-xfer", "id": "e2e-t-xfer", "title": "target xfer", "type": "task", "assignee": "worker"},
        {"key": "t-ifa", "id": "e2e-t-ifa", "title": "target ifa", "type": "task", "assignee": "worker"},
