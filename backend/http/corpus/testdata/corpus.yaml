  # ---------------------------------------------------------------- gates
  # The gate writes: create (one createIssue carrying the gate members and the
  # blocks edge), a real timer gate resolving under gate check, add-waiter (a
  # guarded waiters patch) and update --await-id. A --timeout=1ns timer is
  # expired by the time gate check runs, so the resolution is deterministic.
  - id: mc-gate-create-timer
    source: core formulas / gate-sweep (bd gate create --type=timer --timeout --blocks)
    args: [gate, create, --type=timer, --timeout=1ns, --blocks, e2e-t-gcr, --json]
    ignore_fields: [id]  # each side mints its own gate id
    pending: {slice: "SRV-1", reason: "bd gate create sends the gate members on createIssue behind issues.create.gates, which the reference server does not advertise, so the client refuses before dialing (pinned passing against the current server by backend/http TestE2E_GatesOverHTTP); remove the mark when reference_server.json is upgraded"}
  - id: mc-gate-check-timer-resolves
    source: core gate-sweep.sh (gate check --type=timer --escalate) over a real timer gate
    setup: [[gate, create, --type=timer, --timeout=1ns, --blocks, e2e-t-gct]]
    args: [gate, check, --type=timer, --escalate]
    compare: exit
    verify: [[ready, --json, --limit, "0"]]  # e2e-t-gct is ready on both sides
    ignore_fields: [depends_on_id]  # its (closed) gate's id is minted per workspace
    pending: {slice: "SRV-1", reason: "the setup bd gate create sends the gate members on createIssue behind issues.create.gates, which the reference server does not advertise, so the client refuses before dialing (pinned passing against the current server by backend/http TestE2E_GatesOverHTTP); remove the mark when reference_server.json is upgraded"}
  - id: mc-gate-add-waiter
