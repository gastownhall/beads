  - name: bulk-ready-a.json
    bulk: {id_prefix: e2e-bra, count: 60, priority: 3, metadata: {gc.routed_to: pool-a}}
  - name: bulk-ready-b.json
    bulk: {id_prefix: e2e-brb, count: 60, priority: 3, metadata: {gc.routed_to: pool-a}}
  - name: bulk-wisp-a.json
    bulk: {id_prefix: e2e-wisp-bwa, count: 55, priority: 3, ephemeral: true, metadata: {gc.routed_to: pool-a}}
  - name: bulk-wisp-b.json
    bulk: {id_prefix: e2e-wisp-bwb, count: 55, priority: 3, ephemeral: true, metadata: {gc.routed_to: pool-a}}
  - name: graph-small.json
    content: |
      {"commit_message": "gc graph apply", "nodes": [
        {"key": "root", "id": "e2e-g-root", "title": "graph root", "type": "epic", "metadata": {"gc.kind": "workflow"}},
        {"key": "s1", "id": "e2e-g-s1", "title": "graph step 1", "type": "task", "parent_key": "root", "assignee": "worker", "labels": ["lane:g"], "metadata": {"gc.routed_to": "pool-a"}},
        {"key": "s2", "id": "e2e-g-s2", "title": "graph step 2", "type": "task", "parent_key": "root"}
      ], "edges": [{"from_key": "s2", "to_key": "s1", "type": "blocks"}]}
  - name: graph-eph.json
    content: |
      {"nodes": [
        {"key": "root", "id": "e2e-wisp-g-root", "title": "wisp graph root", "type": "epic"},
        {"key": "s1", "id": "e2e-wisp-g-s1", "title": "wisp graph step", "type": "task", "parent_key": "root"}
      ]}
  - name: delete-list.txt
    content: |
      e2e-t-df1
      e2e-t-df2

seed:
  - [create, --graph, "{file:seed-core.json}", --json]
  - [create, --graph, "{file:bulk-ready-a.json}", --json]
  - [create, --graph, "{file:bulk-ready-b.json}", --json]
  - [create, --graph, "{file:bulk-wisp-a.json}", --json]
  - [create, --graph, "{file:bulk-wisp-b.json}", --json]
  # Graph plans carry no status: a node created in_progress or closed stamps
  # started_at/closed_at, which batchApply's create vocabulary cannot carry
  # (gc's own plans never set a status). Lifecycle goes through update/close.
  - [update, e2e-ip1, e2e-ipna, e2e-ipnb, e2e-mol.1, e2e-mac.2, e2e-t-rel, e2e-t-xfer, e2e-t-ifa, e2e-t-death, e2e-t-rc, e2e-t-boot, --status, in_progress]
  - [update, e2e-wisp-2, --status, in_progress]
  - [close, --force, e2e-done, e2e-ep.2, e2e-mol.3, e2e-mac.1, e2e-t-ro, e2e-gate-c]
  - [comments, add, e2e-r1, "seed comment"]

shapes:
  # ---------------------------------------------------------------- show
  # requests pins each show's round trips (mc-5dkzp): resolving the id,
  # fetching the row and reading it for output are one request per id, which
  # the per-command read memo answers once.
  - id: gc-show-json
    source: gc bdstore.go BdStore.Get (show --json <id>); counts must not read 0
    args: [show, --json, e2e-blk]
    requests: 1
  - id: gc-show-json-batch
    source: gc bdstore_exact_batch.go GetExactBatch
    args: [show, --json, e2e-r1, e2e-a1, e2e-blk, e2e-mol]
    requests: 4
  - id: gc-show-json-wisp
    source: gc workquery.go blocked_by enrichment; wisps live in the ready tier
    args: [show, e2e-wisp-1, --json]
    requests: 1
  - id: gc-show-id-flag
    source: gc cmd_bd_show_watch.go bdWatchRunner (show --json --id=<id>)
    args: [show, --json, --id=e2e-r1]
    requests: 1
  # The worker holds eight in-progress issues; e2e-ip1 is the only P0 among
  # them, so "first in the store's default order" (priority first) names it on
  # both sides. Among equal priorities the order rests on created_at, and a
  # seed that straddles a second boundary on one side only picked another issue.
  - id: gc-show-current
    source: gc cmd_bd_show_watch.go bdWatchRunner (show --current --json)
    args: [show, --current, --json]
    requests: 3
  - id: gc-show-missing
    source: gc BdStore.Get not-found classification (routing fallbacks)
    args: [show, --json, e2e-nonexistent]
    expect_exit: 1
    expect_stderr: "(?i)not found"
    compare: exit
    requests: 1
  # Text show reads the row, then its dependents and its comments: three
  # different URLs the memo cannot collapse.
  - id: mc-show-text
    source: mc prompts (bd show <id>, ~80)
    args: [show, e2e-r1]
    compare: text
    requests: 3

  # ---------------------------------------------------------------- ready
  # e2e-wr and e2e-wisp-wr are the only open rows assigned to the worker when
  # these shapes run, so the assignee shapes compare real rows: a client that
  # sends the wrong assignee or drops --include-ephemeral returns a different
  # list. The wisp is P1 and the task P2, so --limit=1 picks the wisp on both
  # sides by priority alone.
  - id: gc-ready-unlimited
    source: gc bdstore.go bdReadyArgs (BdStore.Ready, ready --json --limit 0)
    args: [ready, --json, --limit, "0"]
    compare: ids
  - id: gc-ready-ephemeral-assignee-unlimited
    source: gc bdstore.go bdReadyArgs with --include-ephemeral --assignee
    args: [ready, --json, --include-ephemeral, --assignee, worker, --limit, "0"]
    compare: ids
  - id: gc-ready-pool-demand
    source: gc workquery.go bdReadyPoolDemandShell (scale_check, --limit=20)
    args: [ready, --metadata-field, gc.routed_to=pool-a, --unassigned, --exclude-type=epic, --exclude-label, "hold:mayor", --exclude-label, "hold:external", --json, --limit=20]
    compare: ids
  - id: gc-ready-pool-demand-unlimited
    source: gc workquery.go bdReadyPoolDemandShell (work_query, --include-ephemeral --limit 0)
    args: [ready, --include-ephemeral, --metadata-field, gc.routed_to=pool-a, --unassigned, --exclude-type=epic, --exclude-label, "hold:mayor", --exclude-label, "hold:external", --json, --limit, "0"]
    compare: ids
  - id: gc-ready-workflow-migration
    source: gc workquery.go bdReadyPoolDemandMigrationShell (--sort oldest --limit 0)
    args: [ready, --include-ephemeral, --metadata-field, gc.run_target=pool-a, --metadata-field, gc.kind=workflow, --unassigned, --exclude-type=epic, --exclude-label, "hold:mayor", --exclude-label, "hold:external", --json, --sort, oldest, --limit, "0"]
    compare: ids
  - id: gc-ready-graph-anchor
    source: gc workquery.go assignedGraphWorkflowAnchorReadyFunctionScript
    args: [ready, --include-ephemeral, --metadata-field, gc.root_bead_id=e2e-mol, --metadata-field, gc.routed_to=pool-a, --exclude-type=epic, --exclude-label, "hold:mayor", --exclude-label, "hold:external", --json, --sort, oldest, --limit=20]
    compare: ids
  - id: gc-ready-assigned-tier
    source: gc workquery.go assignedReadyTierCommand (--assignee=<id> --limit=1)
    args: [ready, --include-ephemeral, --assignee=worker, --json, --limit=1]
    compare: ids
  - id: gc-ready-probe
    source: gc examples/bd gc-beads-bd.sh (bare bd ready probe)
    args: [ready]
    compare: exit
  - id: mc-ready-json
    source: mc scripts/prompts (bd ready --json, ~36)
    args: [ready, --json]
    compare: ids
  - id: mc-ready-mol
    source: mc skills/pr-review (bd ready --mol <root>)
    args: [ready, --mol, e2e-mol, --json]
  - id: mc-ready-parent
    source: mc skills/pr-review (bd ready --parent <root>)
    args: [ready, --parent, e2e-ep, --json]
    compare: ids

  # ---------------------------------------------------------------- list
  - id: gc-list-full-filters
    source: gc bdstore.go listViaBDList (List/ListByLabel/ListByMetadata)
    args: [list, --json, --label=lane:a, --status=open, --type=task, --include-infra, --include-gates, --limit, "0", --metadata-field, gc.routed_to=pool-a]
  - id: gc-list-ping
    source: gc bdstore.go BdStore.Ping (list --json --limit 0)
    args: [list, --json, --limit, "0"]
    compare: ids
  - id: gc-list-limit1
    source: gc doctor_gate_sandbox.go / doctor_store_preflight.go
    args: [list, --json, --limit, "1"]
    compare: count
  - id: gc-list-readonly
    source: gc doctor_v2_session_migration.go readOnlyBdRunner
    args: [--readonly, list, --json, --limit, "1"]
    compare: count
  - id: gc-list-assignee-status
    source: gc bdstore.go listViaBDList (ListByAssignee)
    args: [list, --json, --assignee=worker, --status=in_progress, --include-infra, --include-gates, --limit, "0"]
  - id: gc-list-all-created-before
    source: gc bdstore.go listViaBDList (--all --created-before --include-templates --skip-labels)
    args: [list, --json, --all, --created-before, "2100-01-01T00:00:00Z", --include-infra, --include-gates, --include-templates, --limit, "0", --skip-labels]
    compare: ids
  - id: gc-list-children
    source: gc bdstore.go listViaBDList (Children, --parent)
    args: [list, --json, --include-infra, --include-gates, --limit, "0", --parent, e2e-ep, --all]
  - id: gc-list-in-progress-tier
    source: gc workquery.go assignedInProgressTierCommandWithLimit
    args: [list, --status, in_progress, --assignee=worker, --json, --limit=20]
  - id: gc-list-on-death
    source: gc workquery.go EffectiveOnDeath
    args: [list, --assignee=worker, --status=in_progress, --json]
  - id: gc-list-on-boot
    source: gc workquery.go on_boot recovery (--no-assignee)
    args: [list, --metadata-field, gc.routed_to=pool-a, --status=in_progress, --no-assignee, --json]
    pending: {slice: "SRV-1", reason: "S15b sends --no-assignee as listIssues no_assignee behind issues.list.noAssignee, which the reference server does not advertise, so the client refuses before dialing (pinned passing against the current server by backend/http TestE2E_ListScopeFiltersOverHTTP); remove the mark when reference_server.json is upgraded"}
  - id: gc-list-on-boot-workflow
    source: gc workquery.go on_boot recovery, workflow lane
    args: [list, --metadata-field, gc.run_target=pool-a, --metadata-field, gc.kind=workflow, --status=in_progress, --no-assignee, --json]
    pending: {slice: "SRV-1", reason: "S15b sends --no-assignee as listIssues no_assignee behind issues.list.noAssignee, which the reference server does not advertise, so the client refuses before dialing (pinned passing against the current server by backend/http TestE2E_ListScopeFiltersOverHTTP); remove the mark when reference_server.json is upgraded"}
  - id: mc-list-meta-status
    source: mc assets snapshot.md (list --json --limit --metadata-field --status)
    args: [list, --json, --limit, "50", --metadata-field, gc.routed_to=pool-a, --status, open]
    compare: ids
    # More than 50 rows match, most at one priority: --limit 50 cuts a tie set
    # whose created_at order differs between the two seeds, so each side's 50
    # rows are held to its own unlimited listing instead.
    prefix_of: [list, --json, --limit, "0", --metadata-field, gc.routed_to=pool-a, --status, open]
  - id: mc-list-github-source
