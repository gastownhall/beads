# Shapes that are EXPECTED to be refused on a served workspace, permanently.
# The served run must fail and its output must match `refusal`; if it ever
# succeeds, the entry is stale and the suite fails until it is removed. The
# embedded run is still held to the shape's expect_exit, which an allowlisted
# shape must state, and to its expect_stderr: a shape that stops doing what it
# says on the embedded backend fails as a corpus bug, not as allowed.
# A gap some slice will close is NOT listed here: it is a `pending` mark on the
# shape in corpus.yaml instead.

- id: gc-sql-ready-projection
  reason: >-
    bd sql needs a Dolt sql-server workspace: the embedded backend refuses it
    too (the shape's expect_exit and expect_stderr pin that), and an http
    workspace refuses it with the same "embedded mode" text. gc must not issue
    it against a remote workspace (DESIGN B3 #10 and B6: gc reads the ready
    projection through roles there).
  refusal: "'bd sql' is not yet supported"
- id: gc-sql-release-fallback
  reason: >-
    bd sql needs a Dolt sql-server workspace and the embedded backend refuses
    it too; gc's ReleaseIfCurrent fallback must take the conditional update
    path on a remote workspace (DESIGN B3 #10).
  refusal: "'bd sql' is not yet supported"
- id: mc-meta-set
  reason: >-
    `bd meta set` is not an OSS bd command (pack scripts written against an
    older pinned CLI); it fails on the embedded backend too. The packs should
    use `bd update --set-metadata`, which the corpus covers.
  refusal: 'unknown command "meta"'
