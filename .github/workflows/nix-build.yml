name: nix build

on:
  # No pull_request trigger: pr-risk.yml's required `test-nix` job already
  # runs `nix run .#default` plus `nix flake check -L` on every PR, a strict
  # superset of the `nix build .#default` this workflow exercises here. This
  # workflow still runs on push to main (and workflow_dispatch) so the plain
  # `nix build` path itself stays covered without duplicating a PR-blocking
  # job that never adds coverage pr-risk.yml doesn't already have.
  push:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'default.nix'
      - 'flake.nix'
      - 'flake.lock'
      - 'overlay.nix'
      - 'packages.nix'
  workflow_dispatch:

env:
  BD_DISABLE_METRICS: "1"
  BD_DISABLE_EVENT_FLUSH: "1"

jobs:
  nix-build:
    name: nix build .#default
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3
      - name: Build
        run: nix build .#default --print-build-logs
