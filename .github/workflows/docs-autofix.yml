# Auto-fix stale generated CLI docs on PRs.
#
# The PR workflow's check-doc-flags job already computes the exact
# regeneration patch with CI's canonical pinned build and uploads it as the
# cli-docs-freshness-patch artifact (scripts/check-cli-docs-drift.sh). This
# workflow closes the loop: when a PR run fails and left that artifact, it
# pushes the regen commit to the PR branch (same-repo PRs) or leaves an
# idempotent comment with the one-liner apply recipe (fork PRs).
#
# SECURITY MODEL: this runs with write permissions via workflow_run, so it
# never checks out or executes PR code. It checks out the base default branch
# for scripts, and treats the artifact strictly as data: every path in the
# patch must match an anchored generated-docs allowlist (single path segment,
# no traversal), mode/symlink/rename/copy/binary hunks are refused, and the
# patch is applied to an index in a bare clone and re-checked once staged
# (scripts/docs-autofix-push.sh), so a hostile patch can at most rewrite
# generated doc files on its own PR branch. Pushes are leased to the run's
# head SHA and skipped for heads that are protected or under a ruleset. The
# App private key is a secret of the `autofix` environment, whose deployment-
# branch policy allows only `main`, so only a job running on main can read
# it; the minted token itself is scoped to this one repo with contents:write
# only, so even a hostile patch gains nothing beyond what the job already
# had.
#
# CONCURRENCY: job-level, shared with bazel-autofix.yml per head branch and
# without cancel-in-progress, so the two bots queue instead of racing on one
# branch (see bazel-autofix.yml).
#
# TOKEN NOTE: pushes made with the default GITHUB_TOKEN do not retrigger PR
# checks. On same-repo PRs the push step mints a short-lived installation
# token for the gastownhall-autofix GitHub App (contents:write, scoped to
# this repo only) and uses that instead. Fork PRs always get the apply-recipe
# comment - no token we hold can push to a fork, so the mint step is skipped
# for them.

name: Docs Autofix

on:
  workflow_run:
    workflows: ["PR"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  autofix:
    name: Apply CLI docs regeneration to PR
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    # Bounded: a hung run would hold the shared group for the default 6h.
    timeout-minutes: 10
    # Grants the job read access to this environment's secrets; its
    # deployment-branch policy restricts that to jobs running on main
    # (workflow_run always does), not to any PR branch.
    environment: autofix
    # Shared with bazel-autofix.yml; queue, never cancel.
    concurrency:
      group: autofix-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      # Trusted side only: base repo default branch, never the PR head. The
      # workflow token is not left in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Download docs freshness patch (if any)
        id: patch
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          artifact_ids="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "cli-docs-freshness-patch") | .id')"
          artifact_id="$(printf '%s\n' "$artifact_ids" | head -1)"
          if [ -z "$artifact_id" ]; then
            echo "No docs patch artifact on run ${RUN_ID}; PR failed for other reasons."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dir="${RUNNER_TEMP}/docs-patch"
          mkdir -p "$dir"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${RUNNER_TEMP}/docs-patch.zip"
          # Extract only the expected name, and only as a regular file.
          unzip -o "${RUNNER_TEMP}/docs-patch.zip" cli-docs-freshness.patch -d "$dir" || true
          ls -la "$dir"
          f="$dir/cli-docs-freshness.patch"
          if [ -L "$f" ] || { [ -e "$f" ] && [ ! -f "$f" ]; }; then
            echo "::error::artifact entry cli-docs-freshness.patch is not a regular file"
            exit 1
          fi
          if [ ! -f "$f" ]; then
            echo "Artifact has no cli-docs-freshness.patch; nothing to do."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"

      # Same-repo PRs only: no token we hold can push to a fork, and a fork's
      # head_repository can even be absent (deleted fork), so this mints
      # nothing for it and the push script falls back to the apply-recipe
      # comment. app-token outputs are empty (not failed) when the step is
      # skipped, which is what the fallback below relies on.
      - name: Mint autofix app token
        id: app-token
        if: github.event.workflow_run.head_repository.full_name == github.repository
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.AUTOFIX_APP_ID }}
          private-key: ${{ secrets.AUTOFIX_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Push regen commit or leave apply recipe
        if: steps.patch.outputs.found == 'true'
        env:
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PATCH_FILE: ${{ runner.temp }}/docs-patch/cli-docs-freshness.patch
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          # Split tokens: gh api calls (PR lookup, comments) always use the
          # workflow token, which carries this job's pull-requests:write; the
          # App token is used ONLY for the git push, so it needs no more
          # than contents:write.
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          AUTOFIX_TOKEN_KIND: ${{ steps.app-token.outputs.token && 'app' || 'default' }}
        run: ./scripts/docs-autofix-push.sh
