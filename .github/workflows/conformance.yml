name: Conformance

# Runs the same two-tier storage conformance suite developers run locally:
# the in-process store corpus and the real-binary CLI harness.

on:
  pull_request:
    branches: [ main, 'release/**' ]
    # "Upgrade-relevant code" allowlist (spec-f7.md §2.4): any non-test Go
    # change, build input, or this workflow's own inputs. Kept byte-for-byte
    # identical (modulo each workflow's own file/script entries) across
    # conformance.yml, migration-test.yml and cross-version-smoke.yml, and
    # pinned by TestAdvisoryWorkflowPathFilters.
    paths:
      - '**.go'
      - '!**_test.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.buildflags'
      - '.github/workflows/conformance.yml'
      - 'scripts/conformance.sh'
      - 'test/conformance/**'
  push:
    branches: [ main ]
    paths:
      - '**.go'
      - '!**_test.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.buildflags'
      - '.github/workflows/conformance.yml'
      - 'scripts/conformance.sh'
      - 'test/conformance/**'
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BD_DISABLE_METRICS: "1"
  BD_DISABLE_EVENT_FLUSH: "1"

jobs:
  conformance:
    name: Storage backend conformance (embedded Dolt oracle)
    timeout-minutes: 45
    runs-on: ${{ (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Run conformance (embedded Dolt oracle)
        run: ./scripts/conformance.sh
