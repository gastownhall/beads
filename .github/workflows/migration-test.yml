name: Migration Test Harness

on:
  pull_request:
    # "Upgrade-relevant code" allowlist (spec-f7.md §2.4): kept identical
    # (modulo each workflow's own file/script entries) across conformance.yml,
    # migration-test.yml and cross-version-smoke.yml, and pinned by
    # TestAdvisoryWorkflowPathFilters.
    paths:
      - '**.go'
      - '!**_test.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.buildflags'
      - '.github/workflows/migration-test.yml'
      - 'scripts/migration-test/**'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  BD_DISABLE_METRICS: "1"
  BD_DISABLE_EVENT_FLUSH: "1"
  DOLT_TEST_RUNTIME_VERSION: v2.1.8
  DOLT_TEST_RUNTIME_SHA256: f66318f08ed66e409fc39363ae0fff8ce6fbf6dba9f5bac632b91527b9632a74

jobs:
  historical-upgrades:
    name: Historical ${{ matrix.shard }} shard → candidate
    # v0.55.4 is dynamically linked against the ICU version shipped here, and
    # blacksmith-*-ubuntu-2404 is Ubuntu 24.04, so the libicu74 pin still
    # holds there too.
    # F7c: 14 matrix legs (one per historical version) folded into 3 shards.
    # Each shard builds the candidate once, installs its own dependencies
    # once, then loops over `run.sh --version` for every version it owns,
    # collecting failures so one bad version does not hide the rest (see
    # "Verify explicit historical upgrades" below).
    runs-on: ${{ (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # src: the one version built from source against Go 1.25, instead
          # of installed as a pinned binary.
          - shard: src
            versions: '["v0.9.1"]'
            cache-hash: 453aa2e25bbad328
          # pre-dolt: historical versions that predate the separate Dolt
          # runtime oracle (no "Install Dolt test runtime" step needed).
          - shard: pre-dolt
            versions: '["v0.17.0","v0.49.6","v0.50.3","v0.63.3","v1.0.0"]'
            cache-hash: 03cccab45291ead3
          # dolt-runtime: versions that need the pinned Dolt runtime binary
          # as a read-only oracle (the old per-version `contains(...)` list).
          - shard: dolt-runtime
            versions: '["v0.55.4","v0.56.1","v0.57.0","v0.62.0","v1.0.1","v1.1.0","v1.1.2","v1.2.2"]'
            cache-hash: a8579bd64e9a0926
            # The v1.1.2 tree re-tagged by the recovery release, so it adds no
            # new storage regime — but it is the tag field upgrades actually
            # start from, and it was never in this corpus.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Install test dependencies
        # Backstop for a hang that escapes the inner `timeout` calls, so it has
        # to sit ABOVE what those calls can legitimately consume: 3 update
        # attempts x 120s + 2 backoffs x 10s + 180s install = 560s worst case.
        # 11m leaves ~100s of headroom and stays under the job's 20m budget, so
        # a stuck step fails as a step instead of cancelling the whole job.
        timeout-minutes: 11
        run: |
          updated=""
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get \
                 -o Acquire::Retries=3 \
                 -o Acquire::http::Timeout=30 \
                 -o Acquire::https::Timeout=30 \
                 update; then
              updated=yes
              break
            fi
            echo "::warning::apt-get update attempt $attempt failed or timed out"
            # No backoff after the final attempt - there is nothing left to wait for.
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          # Deliberate best-effort: a stale index still installs these packages
          # from the runner image cache far more often than not, and failing the
          # job here would turn a transient mirror outage into a red build. The
          # warning is what makes the degraded path visible in the job log.
          if [ -z "$updated" ]; then
            echo "::warning::apt-get update failed after 3 attempts; proceeding with cached index"
          fi
          sudo timeout 180 apt-get install -y jq libicu74

      - name: Install Dolt test runtime
        # v0.55.4-v0.62.0 host their fixture on this server; v1.0.1-v1.1.2 use
        # the same pinned binary as a read-only oracle over the wisp plane,
        # which has no `bd dolt sql` equivalent. This is exactly the
        # dolt-runtime shard's version list.
        if: matrix.shard == 'dolt-runtime'
        run: |
          archive="$RUNNER_TEMP/dolt-linux-amd64.tar.gz"
          runtime="$RUNNER_TEMP/dolt-runtime"
          install_root="$GITHUB_WORKSPACE/.tools/dolt"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            "https://github.com/dolthub/dolt/releases/download/${DOLT_TEST_RUNTIME_VERSION}/dolt-linux-amd64.tar.gz" \
            -o "$archive"
          echo "${DOLT_TEST_RUNTIME_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$runtime" "$install_root/bin"
          tar -xzf "$archive" -C "$runtime"
          install -m 0755 "$runtime/dolt-linux-amd64/bin/dolt" "$install_root/bin/dolt"
          "$install_root/bin/dolt" version

      - name: Configure Git
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@beads.test"

      - name: Cache pinned historical release
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/beads-regression
          key: historical-dolt-${{ matrix.shard }}-${{ matrix.cache-hash }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build candidate
        run: make build

      - name: Set up Go 1.25 for v0.9.1 source build
        if: matrix.shard == 'src'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.0'

      # Each version runs as its own `run.sh` subprocess: the underlying
      # historical-dolt-upgrade-test.sh uses `set -euo pipefail` and aborts at
      # its first failure within one process, so a single multi-version
      # invocation could silently hide every version queued after the first
      # failure. Looping subprocess calls here, guarded by `if !`, is what
      # lets "all versions run, and the job fails if any failed" (spec-f7.md
      # §2.3.7) hold for shards with more than one version.
      - name: Verify explicit historical upgrades
        env:
          CANDIDATE_BIN: ./bd
          GIT_CONFIG_NOSYSTEM: "1"
          DOLT_BIN: ${{ github.workspace }}/.tools/dolt/bin/dolt
          SHARD_VERSIONS: ${{ matrix.versions }}
        run: |
          set -euo pipefail
          mapfile -t versions < <(jq -r '.[]' <<<"$SHARD_VERSIONS")
          failed=0
          for v in "${versions[@]}"; do
            echo "::group::Historical upgrade: $v"
            if ! ./scripts/migration-test/run.sh --version "$v"; then
              echo "::error::historical upgrade failed for $v"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
