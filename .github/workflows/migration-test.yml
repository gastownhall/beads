name: Migration Test Harness

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'website/**'
  push:
    tags: ['v*']
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  BD_DISABLE_METRICS: "1"
  BD_DISABLE_EVENT_FLUSH: "1"
  DOLT_TEST_RUNTIME_VERSION: v2.1.8
  DOLT_TEST_RUNTIME_SHA256: f66318f08ed66e409fc39363ae0fff8ce6fbf6dba9f5bac632b91527b9632a74

jobs:
  historical-upgrades:
    if: github.event_name != 'schedule'
    name: Historical ${{ matrix.version }} → candidate
    # v0.55.4 is dynamically linked against the ICU version shipped here.
    # Pin the image so a runner alias update cannot invalidate the fixture.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: v0.9.1
            cache-identity: v0.9.1-source-e3c8554fa2c3e4b9caf7e296e9c8abbe24211a72-go1.25.0-cgo1
          - version: v0.17.0
            cache-identity: v0.17.0-d4d08617a324c85b45c9628bc519d659a9ff9c7c37da67aa48727e0af7f19a75
          - version: v0.49.6
            cache-identity: v0.49.6-8546dc9a47e11dc31ac2bc9a0224a9c690975e91850932cbb62623053fbb7db8
          - version: v0.50.3
            cache-identity: v0.50.3-e94b09e0b6a9324bbc0e81ea36bccaaa42172a926bfedfb389e9a26dedb63184
          - version: v0.55.4
            cache-identity: v0.55.4-e0fa25456dd82890230eef17653448a0bf995104c78864be91c5ed84426a5f49
          - version: v0.56.1
            cache-identity: v0.56.1-4f9f6cc44465a11613ff529009901eaaf841c6b1f91c15e002b0ecda2015a15c
          - version: v0.57.0
            cache-identity: v0.57.0-f8629d5627bed7d25f06f92334addc171d679f9aed9d08c5d42a9684205dc04b
          - version: v0.62.0
            cache-identity: v0.62.0-4cca7265b22e5c3ca8d62ab0b9752bec31f68b7f5fa636282a4c7e5454c35535
          - version: v0.63.3
            cache-identity: v0.63.3-5f4efd2e010209b3f381dbcd783b2a3a652f50ea72f40ef04c8ba434d408bf9e
          - version: v1.0.0
            cache-identity: v1.0.0-7057db1e92428fcf5c08d5dc6b07ead57e588b262cba78b9a26893d55bd29fdb
          - version: v1.0.1
            cache-identity: v1.0.1-1d2364d5d7083a4634a9e734ca87822fb79c2b6625988f9f791e3376313b1b77
          - version: v1.1.0
            cache-identity: v1.1.0-b0f3dd607c3fb989ee08d0a6854fba80d0402971eb108f9af6170bc14d491a34
          - version: v1.1.2
            cache-identity: v1.1.2-a72d71ed374955dc9f83a0f90b54bd7b6a0016709dd1676ae2e368651ed401c2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq libicu74

      - name: Install Dolt test runtime
        if: contains(fromJSON('["v0.55.4","v0.56.1","v0.57.0","v0.62.0"]'), matrix.version)
        run: |
          archive="$RUNNER_TEMP/dolt-linux-amd64.tar.gz"
          runtime="$RUNNER_TEMP/dolt-runtime"
          install_root="$GITHUB_WORKSPACE/.tools/dolt"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            "https://github.com/dolthub/dolt/releases/download/${DOLT_TEST_RUNTIME_VERSION}/dolt-linux-amd64.tar.gz" \
            -o "$archive"
          echo "${DOLT_TEST_RUNTIME_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$runtime" "$install_root/bin"
          tar -xzf "$archive" -C "$runtime"
          install -m 0755 "$runtime/dolt-linux-amd64/bin/dolt" "$install_root/bin/dolt"
          "$install_root/bin/dolt" version

      - name: Configure Git
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@beads.test"

      - name: Cache pinned historical release
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/beads-regression
          key: historical-dolt-${{ matrix.cache-identity }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build candidate
        run: make build

      - name: Set up Go 1.25 for v0.9.1 source build
        if: matrix.version == 'v0.9.1'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.0'

      - name: Verify explicit historical upgrade
        env:
          CANDIDATE_BIN: ./bd
          GIT_CONFIG_NOSYSTEM: "1"
          DOLT_BIN: ${{ github.workspace }}/.tools/dolt/bin/dolt
          HISTORICAL_VERSION: ${{ matrix.version }}
        run: |
          ./scripts/migration-test/run.sh --version "$HISTORICAL_VERSION"

  exhaustive-census:
    name: Regenerate exhaustive schema census
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore independent census-1 cache lane
        id: census-cache-1-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/beads-schema-census-cache/census-1
          key: schema-census-lane-1-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/migration-test/release-catalog.json', 'scripts/migration-test/census/Dockerfile', 'scripts/migration-test/census/*.go', 'go.mod', 'go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            schema-census-lane-1-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/migration-test/release-catalog.json', 'scripts/migration-test/census/Dockerfile', 'scripts/migration-test/census/*.go', 'go.mod', 'go.sum') }}-

      - name: Restore independent census-2 cache lane
        id: census-cache-2-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/beads-schema-census-cache/census-2
          key: schema-census-lane-2-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/migration-test/release-catalog.json', 'scripts/migration-test/census/Dockerfile', 'scripts/migration-test/census/*.go', 'go.mod', 'go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            schema-census-lane-2-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/migration-test/release-catalog.json', 'scripts/migration-test/census/Dockerfile', 'scripts/migration-test/census/*.go', 'go.mod', 'go.sum') }}-

      - name: Regenerate and compare sealed census
        env:
          CENSUS_CACHE: ${{ runner.temp }}/beads-schema-census-cache
          CENSUS_OUTPUT: ${{ runner.temp }}/beads-schema-census-output
          # Two 155-minute caps leave time in this 360-minute job to upload
          # evidence and save only a cache whose integrity checks completed.
          CENSUS_GENERATE_TIMEOUT: 155m
        run: |
          ./scripts/migration-test/census/run-container.sh

      - name: Check independent cache lanes
        id: census-integrity
        if: always()
        env:
          CENSUS_OUTPUT: ${{ runner.temp }}/beads-schema-census-output
        run: |
          test -f "$CENSUS_OUTPUT/census-1-cache-safe" && echo 'lane_1=true' >> "$GITHUB_OUTPUT" || echo 'lane_1=false' >> "$GITHUB_OUTPUT"
          test -f "$CENSUS_OUTPUT/census-2-cache-safe" && echo 'lane_2=true' >> "$GITHUB_OUTPUT" || echo 'lane_2=false' >> "$GITHUB_OUTPUT"

      - name: Save independent census-1 cache lane
        if: always() && steps.census-integrity.outputs.lane_1 == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/beads-schema-census-cache/census-1
          key: schema-census-lane-1-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/migration-test/release-catalog.json', 'scripts/migration-test/census/Dockerfile', 'scripts/migration-test/census/*.go', 'go.mod', 'go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save independent census-2 cache lane
        if: always() && steps.census-integrity.outputs.lane_2 == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/beads-schema-census-cache/census-2
          key: schema-census-lane-2-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/migration-test/release-catalog.json', 'scripts/migration-test/census/Dockerfile', 'scripts/migration-test/census/*.go', 'go.mod', 'go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload sealed census outputs
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-schema-census-sealed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/beads-schema-census-output/runtime-schema-census.json.gz
            ${{ runner.temp }}/beads-schema-census-output/runtime-schema-routes.json
            ${{ runner.temp }}/beads-schema-census-output/runtime-schema-routes.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload validated census failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-schema-census-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/beads-schema-census-output/census-1.json
            ${{ runner.temp }}/beads-schema-census-output/census-2.json
            ${{ runner.temp }}/beads-schema-census-output/census-1-diagnostic.json
            ${{ runner.temp }}/beads-schema-census-output/census-2-diagnostic.json
          if-no-files-found: warn
          retention-days: 14
