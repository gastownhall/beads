name: Docs (Mintlify) checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # The docsync guard also validates engdocs/** and the curated root
      # markdown files (rootDocFiles in test/docsync/docsync_test.go) — keep
      # this filter in sync with that list, or a docs-breaking PR merges
      # green and turns main red at the full test run.
      - 'docs/**'
      - 'engdocs/**'
      - 'test/docsync/**'
      - 'mint.sh'
      - 'README.md'
      - 'AGENTS.md'
      - 'AGENT_INSTRUCTIONS.md'
      - 'CONTRIBUTING.md'
      - 'CLAUDE.md'
      - 'RELEASING.md'
      - 'PR_MAINTAINER_GUIDELINES.md'
      - '.github/scripts/docs-render-check.sh'
      - '.github/workflows/docs-mintlify.yml'

permissions:
  contents: read

concurrency:
  group: docs-mintlify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docsync:
    name: Docs nav/link sync (docsync guard)
    runs-on: ${{ (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 10
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: ${{ runner.environment == 'github-hosted' }}

      # F7c review fix S5: this job's own key copy must match main.yml's
      # seeder key byte-for-byte (TestBlacksmithSetupGoCacheKeysMatchAcrossSeederAndConsumers),
      # which now keys by UTC calendar day instead of github.sha so main
      # pushes don't churn a multi-GB cache entry on every commit; this step
      # computes that same day value locally so the key expression below
      # resolves (steps.* references only resolve within the same job).
      - name: Compute cache date
        id: cache-date
        if: runner.environment == 'self-hosted'
        run: echo "today=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Blacksmith setup-go cache
        if: runner.environment == 'self-hosted'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: blacksmith-sg-v1-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.today }}
          restore-keys: |
            blacksmith-sg-v1-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            blacksmith-sg-v1-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Run docsync guard
        run: go test -tags=gms_pure_go ./test/docsync

  broken-links:
    name: Mintlify broken-links (baseline-aware)
    runs-on: ${{ (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 10
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22

      - name: Run baseline-aware broken-link check
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: .github/scripts/docs-render-check.sh "$BASE_REF"
