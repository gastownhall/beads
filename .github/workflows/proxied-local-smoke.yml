# Managed-local proxied lifecycle lane.
#
# The proxied shards in main.yml exercise command behavior against an
# EXTERNALLY managed Dolt testcontainer. This lane covers the production
# local-first path those shards cannot: bd launches its own loopback proxy,
# the proxy launches a locally installed `dolt sql-server`, and the whole
# lifecycle (create/read, loopback-only listeners, idle shutdown,
# transparent restart with persistence), identity failures, orphan recovery,
# and start/stop convergence run INSIDE a network namespace with only
# loopback up — proving no outbound network is needed once the binaries are
# installed. Linux first; the test lane defines Windows/macOS parity but does
# not implement those OS-specific observation helpers yet.

name: Proxied Local Lifecycle

on:
  workflow_dispatch:
  merge_group:
  push:
    branches: [main]
    paths:
      - 'cmd/bd/proxied_local_*'
      - 'cmd/bd/proxied_server*.go'
      - 'cmd/bd/dolt*.go'
      - 'cmd/bd/*_proxied_server.go'
      - 'cmd/bd/backup*.go'
      - 'cmd/bd/purge*.go'
      - 'cmd/bd/*managed_local*'
      - 'cmd/bd/proxied_outage_reconnect_integration_test.go'
      - 'cmd/bd/db_proxy_child.go'
      - 'cmd/bd/init*.go'
      - 'cmd/bd/proxied_integration_helpers_test.go'
      - 'cmd/bd/store_factory*.go'
      - 'cmd/bd/test_dolt_server_cgo_test.go'
      - 'cmd/bd/tracker_proxy_uow_conformance_integration_test.go'
      - 'cmd/bd/uow_factory.go'
      - 'internal/configfile/**'
      - 'internal/doltserver/**'
      - 'internal/storage/dbproxy/**'
      - 'internal/storage/uow/**'
      - 'internal/tracker/conformance/**'
      - 'internal/tracker/uow_store.go'
      - 'internal/tracker/engine.go'
      - 'internal/tracker/store.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/proxied-local-smoke.yml'
  pull_request:
    paths:
      - 'cmd/bd/proxied_local_*'
      - 'cmd/bd/proxied_server*.go'
      - 'cmd/bd/dolt*.go'
      - 'cmd/bd/*_proxied_server.go'
      - 'cmd/bd/backup*.go'
      - 'cmd/bd/purge*.go'
      - 'cmd/bd/*managed_local*'
      - 'cmd/bd/proxied_outage_reconnect_integration_test.go'
      - 'cmd/bd/db_proxy_child.go'
      - 'cmd/bd/init*.go'
      - 'cmd/bd/proxied_integration_helpers_test.go'
      - 'cmd/bd/store_factory*.go'
      - 'cmd/bd/test_dolt_server_cgo_test.go'
      - 'cmd/bd/tracker_proxy_uow_conformance_integration_test.go'
      - 'cmd/bd/uow_factory.go'
      - 'internal/configfile/**'
      - 'internal/doltserver/**'
      - 'internal/storage/dbproxy/**'
      - 'internal/storage/uow/**'
      - 'internal/tracker/conformance/**'
      - 'internal/tracker/uow_store.go'
      - 'internal/tracker/engine.go'
      - 'internal/tracker/store.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/proxied-local-smoke.yml'

permissions:
  contents: read

jobs:
  managed-local-smoke:
    name: Managed-local proxied lifecycle (Linux, offline)
    runs-on: ${{ (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 25
    env:
      CGO_ENABLED: "1"
      # Pinned so the lane tests a known dolt CLI, not whatever the installer
      # resolves on a given day. Bump deliberately, and only in lockstep with
      # the measured pin in scripts/ci/install-dolt.sh (see "Which Dolt
      # version to install" in docs/architecture/dolt.md).
      DOLT_VERSION: 2.4.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: ${{ runner.environment == 'github-hosted' }}

      # F7c review fix S5: this job's own key copy must match main.yml's
      # seeder key byte-for-byte (TestBlacksmithSetupGoCacheKeysMatchAcrossSeederAndConsumers),
      # which now keys by UTC calendar day instead of github.sha so main
      # pushes don't churn a multi-GB cache entry on every commit; this step
      # computes that same day value locally so the key expression below
      # resolves (steps.* references only resolve within the same job).
      - name: Compute cache date
        id: cache-date
        if: runner.environment == 'self-hosted'
        run: echo "today=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Blacksmith setup-go cache
        if: runner.environment == 'self-hosted'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: blacksmith-sg-v1-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.today }}
          restore-keys: |
            blacksmith-sg-v1-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            blacksmith-sg-v1-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Install pinned Dolt CLI
        run: |
          curl -fsSL "https://github.com/dolthub/dolt/releases/download/v${DOLT_VERSION}/dolt-linux-amd64.tar.gz" -o /tmp/dolt.tar.gz
          tar -xzf /tmp/dolt.tar.gz -C /tmp
          sudo install /tmp/dolt-linux-amd64/bin/dolt /usr/local/bin/dolt
          dolt version

      - name: Build bd and compile the test binary (online)
        run: |
          go build -tags gms_pure_go -o /tmp/bd-under-test ./cmd/bd
          go test -tags gms_pure_go -c -o /tmp/proxied-local-smoke.test ./cmd/bd

      - name: Assert the managed-local lifecycle tests are compiled in
        run: |
          listed="$(
            BEADS_TEST_PROXIED_LOCAL=1 \
            BEADS_TEST_SKIP=dolt \
            /tmp/proxied-local-smoke.test \
              -test.list '^TestManagedLocalProxied'
          )"
          for test_name in \
            TestManagedLocalProxiedLifecycleSmoke \
            TestManagedLocalProxiedForeignListenerNotAdopted \
            TestManagedLocalProxiedReusedPidNeverKilled \
            TestManagedLocalProxiedLegacyRecordFailClosed \
            TestManagedLocalProxiedOrphanBackendReaped \
            TestManagedLocalProxiedNProcessColdStartConvergence \
            TestManagedLocalProxiedStopStartInterleave \
            TestManagedLocalProxiedDoltStatusReportsLiveTopology \
            TestManagedLocalProxiedDoltStartRefusesOverLiveProxy \
            TestManagedLocalProxiedDoltStartRefusesWithProxyDown \
            TestManagedLocalProxiedDoltLifecycleLeavesOtherTopologiesAlone \
            TestManagedLocalProxiedTrackerUOWConformance \
            TestManagedLocalProxiedBackupRoundTrip \
            TestManagedLocalProxiedAutoBackup \
            TestManagedLocalProxiedBackupRestoreRefusedWhileAttached \
            TestManagedLocalProxiedPurgeWispsPlaneRetention \
            TestManagedLocalProxiedBackendCleanExitRetiresProxy
          do
            if ! grep -qx "$test_name" <<<"$listed"; then
              echo "managed-local lifecycle test $test_name is missing; got: '$listed'" >&2
              exit 1
            fi
          done

      - name: Run managed-local lifecycle lane offline (loopback-only netns)
        run: |
          sudo env \
            "PATH=$PATH" \
            BEADS_TEST_PROXIED_LOCAL=1 \
            BEADS_TEST_SKIP=dolt \
            BEADS_TEST_BD_BINARY=/tmp/bd-under-test \
            unshare --net -- bash -euxc '
              ip link set lo up
              # Prove the namespace really has no outbound network before
              # trusting anything the test reports.
              if timeout 3 bash -c "exec 3<>/dev/tcp/1.1.1.1/443" 2>/dev/null; then
                echo "outbound network unexpectedly available inside the netns" >&2
                exit 1
              fi
              cd cmd/bd
              /tmp/proxied-local-smoke.test \
                -test.run "^TestManagedLocalProxied" \
                -test.v -test.timeout 15m
            '
