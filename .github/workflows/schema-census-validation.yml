name: Schema Census Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate schema census
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Validate schema census
        run: go test -tags gms_pure_go -count=1 ./scripts/migration-test/census
