name: "Update flake.lock"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at midnight UTC

permissions:
  contents: read

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Mint flake update token
        id: flake-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: ${{ secrets.FLAKE_UPDATE_APP_ID }}
          private-key: ${{ secrets.FLAKE_UPDATE_APP_PRIVATE_KEY }}
          owner: gastownhall
          repositories: beads
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: main
          token: ${{ steps.flake-token.outputs.token }}

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4b040423529d49b1a19ba918742e0aa9aa95031a # v3

      - name: Update flake.lock
        run: nix flake update

      - name: Verify update scope
        run: |
          changed_files="$(git diff --name-only)"
          untracked_files="$(git ls-files --others --exclude-standard)"

          if [ -n "$untracked_files" ]; then
            echo "Unexpected untracked files:"
            echo "$untracked_files"
            exit 1
          fi

          if [ -n "$changed_files" ] && [ "$changed_files" != "flake.lock" ]; then
            echo "Unexpected changed files:"
            echo "$changed_files"
            exit 1
          fi

      - name: Create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.flake-token.outputs.token }}
          commit-message: "flake.lock: Update"
          base: main
          branch: update_flake_lock_action
          delete-branch: true
          add-paths: flake.lock
          title: "chore(nix): update flake.lock"
          body: |
            Automated flake.lock update generated by the scheduled Nix workflow.
