name: Cross-Version Smoke Tests

on:
  # On tag push (release gate): test the last 30 releases for broad regression coverage
  push:
    tags:
      - 'v*'

  # On PR to main or a release branch: test only the last 5 releases for fast
  # feedback. Release-targeted PRs are exactly the ones where cross-version
  # upgrade breakage is most expensive to discover at tag time.
  pull_request:
    branches: [ main, 'release/**' ]
    # "Upgrade-relevant code" allowlist (spec-f7.md §2.4): kept identical
    # (modulo each workflow's own file/script entries) across conformance.yml,
    # migration-test.yml and cross-version-smoke.yml, and pinned by
    # TestAdvisoryWorkflowPathFilters.
    paths:
      - '**.go'
      - '!**_test.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.buildflags'
      - '.github/workflows/cross-version-smoke.yml'
      - 'scripts/upgrade-smoke-test.sh'

  # Allow manual trigger with custom version count
  workflow_dispatch:
    inputs:
      version_count:
        description: 'Number of previous releases to test against'
        required: false
        default: '5'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BD_DISABLE_METRICS: "1"
  BD_DISABLE_EVENT_FLUSH: "1"

jobs:
  # F7c: smoke's old 1-job-per-version matrix (up to 30 on tag push) folded
  # into chunks of 5 versions each, resolved by the `versions` job below. Each
  # chunk builds the candidate binary once and loops over
  # upgrade-smoke-test.sh's own SMOKE_VERSIONS env var (which already
  # self-reinvokes per version and collects failures, so a bad version in a
  # chunk does not hide the rest).
  smoke:
    name: Upgrade smoke (chunk ${{ strategy.job-index }})
    runs-on: ${{ (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.versions.outputs.chunks) }}

    needs: versions

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: ${{ runner.environment == 'github-hosted' }}

      # F7c review fix S5: this job's own key copy must match main.yml's
      # seeder key byte-for-byte (TestBlacksmithSetupGoCacheKeysMatchAcrossSeederAndConsumers),
      # which now keys by UTC calendar day instead of github.sha so main
      # pushes don't churn a multi-GB cache entry on every commit; this step
      # computes that same day value locally so the key expression below
      # resolves (steps.* references only resolve within the same job).
      - name: Compute cache date
        id: cache-date
        if: runner.environment == 'self-hosted'
        run: echo "today=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Blacksmith setup-go cache
        if: runner.environment == 'self-hosted'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: blacksmith-sg-v1-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.today }}
          restore-keys: |
            blacksmith-sg-v1-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            blacksmith-sg-v1-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Configure Git
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@beads.test"

      - name: Compute chunk cache key
        id: chunk
        env:
          CHUNK_JSON: ${{ toJson(matrix.chunk) }}
        run: |
          versions="$(jq -r '. | join(" ")' <<<"$CHUNK_JSON")"
          hash="$(printf '%s' "$versions" | sha256sum | cut -c1-16)"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      # actions/cache (bare) auto-saves at job end on any key miss, which
      # would let a same-repo PR that changes the chunk's version set write a
      # binaries cache entry another PR (or a later run) could then read back
      # without re-downloading or re-verifying it. Restore-only here; the
      # matching save below is gated off pull_request so only push/dispatch
      # runs can populate this cache (B2, F7c implementation report).
      - name: Restore previous release binaries cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/beads-regression
          key: smoke-binaries-${{ steps.chunk.outputs.hash }}-${{ runner.os }}

      - name: Build candidate binary
        run: go build -tags gms_pure_go -o /tmp/bd-candidate ./cmd/bd

      - name: Run upgrade smoke tests
        env:
          CANDIDATE_BIN: /tmp/bd-candidate
          SMOKE_VERSIONS: ${{ steps.chunk.outputs.versions }}
        run: ./scripts/upgrade-smoke-test.sh

      - name: Save previous release binaries cache
        # Allow-list the two triggers this workflow actually intends to
        # write from (push, workflow_dispatch), rather than deny-listing
        # pull_request: a deny-list of `!= 'pull_request'` also admits a
        # hypothetical future merge_group event, which this job's own
        # runs-on expression already resolves to Blacksmith for - exactly
        # the same same-repo-writer risk X1 closed for pull_request. Pinned
        # by TestBlacksmithReachableAdvisoryJobsNeverSaveACache, which checks
        # both the pull_request and merge_group trust contexts independently.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/beads-regression
          key: smoke-binaries-${{ steps.chunk.outputs.hash }}-${{ runner.os }}

  versions:
    name: Resolve versions to test
    runs-on: ${{ (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      chunks: ${{ steps.resolve.outputs.chunks }}
    steps:
      - name: Resolve release versions
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          # Tag push and manual dispatch test more versions; PRs test fewer for speed
          VERSION_COUNT: ${{ (github.event_name == 'push' && '30') || (github.event_name == 'workflow_dispatch' && inputs.version_count) || '5' }}
        run: |
          VERSIONS=$(gh release list \
            --repo gastownhall/beads \
            --limit "$VERSION_COUNT" \
            --json tagName \
            --jq '[.[].tagName]')
          # Chunks of 5: PRs (5 versions) get 1 chunk; tag pushes (30
          # versions) get 6. Folds the old 1-job-per-version matrix down to
          # one job per chunk in `smoke` above, without dropping any version.
          CHUNKS=$(jq -c '[range(0; length; 5) as $i | .[$i:$i+5]]' <<<"$VERSIONS")
          echo "chunks=$CHUNKS" >> "$GITHUB_OUTPUT"
          echo "Testing versions: $VERSIONS"
          echo "Chunks: $CHUNKS"
