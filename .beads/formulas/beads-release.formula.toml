# Beads Release Formula v2 (Gate-Aware)
#
# This formula uses gates for async waits during CI, enabling clean phase handoffs.
# Instead of polling, the polecat completes Phase 1, and a gate blocks Phase 2
# until GitHub Actions finishes.
#
# Phases:
#   1. Prep & Push: preflight -> push-tag (polecat work)
#   2. Gate: await-ci (async wait for release.yml)
#   3. Verify: verify-github, verify-npm, verify-pypi, verify-homebrew-core (parallel)
#   4. Install: local-install -> cleanup-stale-dolt-orphans -> release-complete

formula = "beads-release"
description = """
Beads release workflow v2 - gate-aware async release.

This formula orchestrates a complete release cycle with async gates:

Phase 1 (Polecat Work):
  1. Preflight checks (clean git, up to date)
  2. Documentation updates (CHANGELOG, info.go)
  3. Version bump (all components)
  4. Git operations (commit, tag, push)

Gate (Async Wait):
  5. await-ci: Gate on GitHub Actions release.yml completion

Phase 2 (Parallel Verification):
  6. Verify GitHub release, npm package, PyPI package, Homebrew core formula (concurrent)

Phase 3 (Installation):
  7. Local installation update
  8. Stale Dolt orphan cleanup

## Usage

```bash
bd mol wisp create beads-release --var version=0.44.0
```

Or assign to a polecat:
```bash
gt sling beads/polecats/p1 --formula beads-release --var version=0.44.0
```

The polecat will complete Phase 1, then signal phase-complete. The gate blocks
until release.yml finishes. A new polecat (or the same one) resumes for Phases 2-3.
"""
type = "workflow"
phase = "vapor"  # Ensures this runs as a wisp - bd pour will warn, gt sling --formula creates wisp
pour = true      # Materialize release steps for checkpoint/resume visibility
version = 1

[vars.version]
description = "The semantic version to release (e.g., 0.44.0)"
required = true

# =============================================================================
# Phase 1: Prep & Push
# =============================================================================

[[steps]]
id = "preflight-worktree"
title = "Preflight: Verify git context"
description = """
Ensure we're in the correct git directory, especially for worktree setups.

```bash
# Check current repo root and remote
git rev-parse --show-toplevel
git remote get-url origin

# Verify this is the main worktree (not a linked worktree)
git worktree list
```

For worktree setups, releases should be done from the main worktree to ensure:
- Correct file paths in commits
- Proper tag association
- Clean branch history

If you're in a linked worktree:
1. Note the path to the main worktree (first line of `git worktree list`)
2. Switch to that directory before proceeding
3. Or use: `cd $(git worktree list | head -1 | cut -d' ' -f1)`

Red flags:
- Remote URL doesn't match expected repository
- You're in a linked worktree (not the main one)
- `git status` shows different files than expected
"""

[[steps]]
id = "preflight-git"
title = "Preflight: Check git status & auto-stash"
needs = ["preflight-worktree"]
description = """
Ensure working tree is clean before starting release.

```bash
git status --short
```

Handling uncommitted changes:

If changes are in release-related files (CHANGELOG, version files), you may want to:
- Include them in the release commit
- Or stash and apply after version bump

If changes are in non-release files (e.g., .beads/config.yaml, .claude/settings.json, local configs):
```bash
# Auto-stash non-release files
git stash push -m "pre-release: non-release changes" -- .beads/ .claude/ *.local* .env*

# Verify working tree is now clean (or only has release files)
git status --short
```

Important: The bump script may fail if non-release files are modified. Always stash:
- `.beads/` directory (local config)
- `.claude/` directory (agent settings)
- Any `.local`, `.env`, or personal config files

After release completes, restore with:
```bash
git stash pop
```
"""

[[steps]]
id = "preflight-pull"
title = "Preflight: Pull latest & verify sync"
needs = ["preflight-git"]
description = """
Ensure we're up to date with origin and branch is properly synced.

**Every `origin/...` below means the branch you are RELEASING FROM, which is
`release/x.y.z` — never `main`.** Resetting a release branch onto main's tip
destroys the reviewed release-prep commit and leaves you tagging an untested
main SHA, which is exactly the failure the release-branch policy exists to
prevent. Pin the name first and use the variable:

```bash
# The branch you are releasing from. For a prerelease this is still the BASE
# version's branch: an RC for 1.3.0 is cut on release/1.3.0.
REL_BRANCH="release/1.3.0"

git rev-parse --abbrev-ref HEAD    # must equal $REL_BRANCH
```

```bash
# Fetch latest from origin
git fetch origin

# Check branch status BEFORE pulling
git status -sb
```

Branch sync verification:
- "Your branch is behind" -> Pull needed, proceed with `git pull --rebase`
- "Your branch is ahead" -> You have unpushed commits - review before release!
- "Your branch has diverged" -> STOP - resolve divergence first

```bash
# If branch is behind or even, pull latest
git pull --rebase
```

Recovering from divergence:
If your branch has diverged from origin (e.g., after a botched commit):
```bash
# Option 1: Back up first, ALWAYS
git branch backup-before-release

# Option 2: Reset to the release branch's origin (loses local commits)
git reset --hard "origin/$REL_BRANCH"

# Option 3: Rebase local commits on top of it
git rebase "origin/$REL_BRANCH"
```

After pulling, verify sync:
```bash
git status -sb
# Should show: "## release/1.3.0...origin/release/1.3.0" (no ahead/behind)
```
"""

[[steps]]
id = "detect-half-done-release"
title = "Detect half-done release"
needs = ["preflight-pull"]
description = """
Check if a previous release was started but not completed (version mismatch).

Compare versions across all sources:
```bash
# Last git tag
LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
echo "Last tag: $LAST_TAG"

# Version in code
CODE_VERSION=$(grep 'Version = ' cmd/bd/version.go | cut -d'"' -f2)
echo "Code version: $CODE_VERSION"

# Version in CHANGELOG (most recent versioned section)
CHANGELOG_VERSION=$(grep -E '## \\[[0-9]+\\.[0-9]+\\.[0-9]+\\]' CHANGELOG.md | head -1 | grep -oE '[0-9]+\\.[0-9]+\\.[0-9]+')
echo "CHANGELOG version: $CHANGELOG_VERSION"

# Version in npm package
NPM_VERSION=$(jq -r '.version' npm-package/package.json)
echo "npm version: $NPM_VERSION"
```

Healthy state (ready for new release):
- All versions match (e.g., all show 0.46.0)
- Last tag matches code version

Half-done release detected if:
- CHANGELOG shows {{version}} but code shows previous version
- Code version doesn't match last tag
- npm/PyPI versions are out of sync

Recovery from half-done release:
```bash
# If CHANGELOG was updated but code wasn't bumped:
# Either complete the release or revert CHANGELOG changes

# Check what state we're in
git diff $LAST_TAG -- CHANGELOG.md | head -50
```

If mismatch detected, either:
1. Complete the partial release (bump remaining files)
2. Revert partial changes and start fresh
3. Carefully verify what's already pushed vs local-only
"""

[[steps]]
id = "review-changes"
title = "Review changes since last release"
needs = ["detect-half-done-release"]
description = """
Understand what's being released.

```bash
git log $(git describe --tags --abbrev=0)..HEAD --oneline
```

Categorize changes:
- Features (feat:)
- Fixes (fix:)
- Breaking changes
- Documentation
"""

[[steps]]
id = "verify-changelog-complete"
title = "Verify CHANGELOG completeness"
needs = ["review-changes"]
description = """
Ensure CHANGELOG captures ALL commits since the last release.

Step 1: Count commits since last tag
```bash
LAST_TAG=$(git describe --tags --abbrev=0)
COMMIT_COUNT=$(git rev-list $LAST_TAG..HEAD --count)
echo "Commits since $LAST_TAG: $COMMIT_COUNT"
```

Step 2: List all commits with their messages
```bash
git log $LAST_TAG..HEAD --oneline --no-merges
```

Step 3: Cross-reference with CHANGELOG
Open CHANGELOG.md and verify every significant commit is documented in [Unreleased].

Red flags for stale CHANGELOG:
- If CHANGELOG was last modified days ago but there are recent commits
- If commit count seems high but [Unreleased] section is sparse
- If PR titles in commits don't match CHANGELOG entries

```bash
# Check when CHANGELOG was last modified
git log -1 --format="%ar" -- CHANGELOG.md

# Compare to latest commit date
git log -1 --format="%ar"
```

If CHANGELOG is stale:
1. Review all commits since last tag
2. Add missing entries to appropriate sections (Added/Changed/Fixed)
3. Group related changes
4. Focus on user-facing changes and breaking changes

Don't proceed until CHANGELOG is complete - it's the release notes!
"""

[[steps]]
id = "update-changelog"
title = "Update CHANGELOG.md"
needs = ["verify-changelog-complete"]
description = """
Write the [Unreleased] section with all changes for {{version}}.

Format: Keep a Changelog (https://keepachangelog.com)

Sections:
- ### Added
- ### Changed
- ### Fixed
- ### Documentation

The bump script will stamp the date automatically.
"""

[[steps]]
id = "update-info-go"
title = "Update info.go versionChanges"
needs = ["update-changelog"]
description = """
Add entry to versionChanges in cmd/bd/info.go.

This powers `bd info --whats-new` for agents.

```go
"{{version}}": {
    "summary": "Brief description",
    "changes": []string{
        "Key change 1",
        "Key change 2",
    },
},
```

Focus on workflow-impacting changes agents need to know.
"""

[[steps]]
id = "bump-versions"
title = "Bump every version reference"
needs = ["update-info-go"]
description = """
Run the one script that owns every version reference.

```bash
./scripts/update-versions.sh {{version}}
```

This is the ONLY sanctioned way to bump. Hand-rolled sed per file is how the
set drifts: this formula used to carry its own copies and pointed at a
`claude-plugin/` path that has not existed since the plugins moved under
`plugins/beads/`, while missing the copilot plugin, the MCP lockfile and the
tracked git-hook markers entirely — so it would have failed outright, or
shipped inconsistent versions, on every step after the stale path.

`scripts/update-versions.sh` rewrites, in one pass:

- `cmd/bd/version.go` — the canonical version everything else is compared to
- `plugins/beads/.claude-plugin/plugin.json`
- `plugins/beads/.codex-plugin/plugin.json`
- `plugins/beads/.copilot-plugin/plugin.json`
- `.claude-plugin/marketplace.json`
- `integrations/beads-mcp/pyproject.toml`
- `integrations/beads-mcp/src/beads_mcp/__init__.py`
- `integrations/beads-mcp/uv.lock` — via `uv lock`
- `npm-package/package.json`
- `.githooks/*` — the `BEGIN`/`END BEADS INTEGRATION v<version>` markers
- `default.nix`
- `cmd/bd/winres/winres.json`, `cmd/bd/winres/manifest.xml`
- `README.md` — the static Alpha badge, if one is present (it is not today;
  README uses live npm/PyPI/GitHub badges)

Two of those have burned a release before, so check the script's output rather
than assuming:

- **`uv` must be installed.** Without it the script WARNS and leaves
  `uv.lock` stale. The release workflow's MCP gate runs `uv sync --locked`,
  which fails only in the tag-triggered run — after the tag exists and can no
  longer be rewritten. That burned v1.1.1 and cost v1.1.0 and v1.1.2 their
  first runs. If you see `uv not found` or `uv lock failed`, stop and fix it:
  ```bash
  uv lock --directory integrations/beads-mcp
  ```
- **The `.githooks/*` markers are rewritten wholesale**, not matched against
  the current version, because they can already be drifted when the bump runs
  (they still said v1.1.0 during the v1.2.0 bump).

Not covered here, by design: `CHANGELOG.md` and `cmd/bd/info.go` (earlier
steps), and `default.nix`'s `vendorHash` (next step).

Verify:
```bash
git diff --stat
```
"""

[[steps]]
id = "update-vendorhash"
title = "Update Nix vendorHash if needed"
needs = ["bump-versions"]
description = """
Update vendorHash if go.mod/go.sum changed since last release.

Check if update is needed:
```bash
# Compare go.mod/go.sum against last tag
LAST_TAG=$(git describe --tags --abbrev=0)
git diff $LAST_TAG -- go.mod go.sum
```

If there are changes, run the update script:
```bash
./scripts/update-nix-vendorhash.sh
```

The script auto-detects nix or Docker and updates the hash automatically.

Verify:
```bash
grep 'vendorHash = ' default.nix
```
"""

[[steps]]
id = "stamp-changelog"
title = "Stamp changelog with release date"
needs = ["update-vendorhash"]
description = """
Add the release date to the [Unreleased] section header.

```bash
DATE=$(date +%Y-%m-%d)

# macOS
sed -i '' "s/## \\[Unreleased\\]/## [Unreleased]\\
\\
## [{{version}}] - $DATE/" CHANGELOG.md

# Linux
sed -i "s/## \\[Unreleased\\]/## [Unreleased]\\n\\n## [{{version}}] - $DATE/" CHANGELOG.md
```

Note: The update-changelog step handles the content; this step just adds the date stamp.

Verify:
```bash
grep -A2 '\\[Unreleased\\]' CHANGELOG.md
```
"""

[[steps]]
id = "verify-versions"
title = "Verify version consistency"
needs = ["stamp-changelog"]
description = """
Run the gate, not a hand-listed grep pile — the grep list is what drifts.

```bash
./scripts/check-versions.sh
```

`scripts/check-versions.sh` reads the canonical version out of
`cmd/bd/version.go` and compares the gated files against it: all three plugin
manifests (claude, codex, copilot), the marketplace, the MCP pyproject /
`__init__.py` / `uv.lock` pin (plus `uv lock --check` for freshness when `uv`
is present), the npm package, both `BEADS INTEGRATION` markers in every
`.githooks/*` file, and the Windows PE metadata in `winres.json` and
`manifest.xml`. It exits non-zero on any mismatch and names the file. This is
the same script the release-tag pre-push hook and CI run, so a green run here
is the real signal.

It must print `✓ Version files in sync at: {{version}}` before you continue.

**If it fails, do NOT just re-run the bump — that is a no-op here.**
`update-versions.sh` derives the OLD version from `cmd/bd/version.go`, which by
this point already reads `{{version}}`, so its substitutions rewrite
`{{version}} -> {{version}}` and leave the drifted file exactly as it was while
printing a green "Version constants updated". Only the `.githooks` markers
(rewritten wholesale) and `uv.lock` (regenerated) heal on a re-run. The script
prints the three remedies that do work; the usual one is to edit the named file
to `{{version}}` and re-run the check.

`check-versions.sh` does NOT gate `default.nix` or `README.md`. Confirm
`default.nix` yourself:

```bash
grep 'version = ' default.nix          # should be {{version}}
```

(For a prerelease, do not expect the version string to appear uniformly in the
winres files: `file_version`/`product_version` and the manifest's four-part
version carry the BASE version because PE fields must be purely numeric, while
`FileVersion`/`ProductVersion` carry the full `{{version}}`. check-versions.sh
now encodes that split, so let it do the checking.)
"""

[[steps]]
id = "commit-release"
title = "Commit release"
needs = ["verify-versions"]
description = """
Stage and commit all version changes.

```bash
git add -A
git commit -m "chore: Bump version to {{version}}"
```

Review the commit to ensure all expected files are included.
"""

[[steps]]
id = "push-main"
title = "Land the release prep as a PR"
needs = ["commit-release"]
description = """
Releases are cut from `release/x.y.z`, not from the tip of `main` — see the
"Release Branches" section of RELEASING.md. **Nothing is pushed straight to the
release branch, and nothing is tagged before the PR merges.**

The branch is named for the BASE version: a `1.3.0-rc.1` run still targets
`release/1.3.0`. Derive it rather than substituting `{{version}}` directly,
which would name a branch nothing ever creates and fail with
`src refspec ... does not match any`:

```bash
BASE="$(printf '%s' "{{version}}" | sed 's/-.*//')"
REL_BRANCH="release/$BASE"
echo "$REL_BRANCH"
```

Create the prep branch, push it, and open the PR:

```bash
git checkout -b "release-prep/v{{version}}"
git push -u origin "release-prep/v{{version}}"
gh pr create --base "$REL_BRANCH" --label status/needs-review-auto
```

Wait for it to merge, then take the merged state:

```bash
git checkout "$REL_BRANCH" && git pull
```

After the release ships, every commit that landed only on the release branch
needs a forward-port PR to `main`, the version bump included:

```bash
git log --oneline "main..$REL_BRANCH"
```
"""

[[steps]]
id = "create-tag"
title = "Create release tag on the merged commit"
needs = ["push-main"]
description = """
Create the annotated tag on the MERGED commit, with the release branch checked
out and pulled (previous step).

```bash
git rev-parse --abbrev-ref HEAD    # must be the release branch, not the prep branch
git tag -a v{{version}} -m "Release v{{version}}"
```

Tagging before the merge is the failure to avoid, in two shapes. With branch
protection on, the direct push is rejected after the tag already exists
locally. With a squash merge, the tag points at a commit that is not an
ancestor of the release branch — and goreleaser packages `CHANGELOG.md` *from
the tag* into every published archive, so the release would ship the
pre-review notes.

Verify: `git tag -l | tail -5`
"""

[[steps]]
id = "push-tag"
title = "Push release tag"
needs = ["create-tag"]
description = """
Push the version tag to trigger CI release.

```bash
git push origin v{{version}}
```

This triggers GitHub Actions to build artifacts and publish.

Phase 1 Complete: After this step, signal phase-complete:
```bash
gt done --phase-complete
```

The gate will block until CI finishes. A new session will resume at Phase 2.
"""

# =============================================================================
# Gate: CI Completion
# =============================================================================

[[steps]]
id = "await-ci"
title = "Await CI: release.yml completion"
needs = ["push-tag"]
description = """
Gate step: Wait for GitHub Actions release workflow to complete.

This gate blocks until the release.yml workflow run succeeds.
The Refinery auto-discovers the workflow run triggered by v{{version}}
and closes this gate when it completes.

Expected time: 5-10 minutes

The gate monitors:
- Build artifacts (all platforms)
- Test suite pass
- npm publish
- PyPI publish

If the workflow fails, this gate remains open and requires manual intervention.
"""

[steps.gate]
type = "gh:run"
id = "release.yml"
timeout = "30m"

# =============================================================================
# Phase 2: Verification (Parallel)
# =============================================================================

[[steps]]
id = "verify-github"
title = "Verify GitHub release"
needs = ["await-ci"]
description = """
Check the GitHub releases page.

https://github.com/gastownhall/beads/releases/tag/v{{version}}

Verify:
- Release created
- Binaries attached (linux, darwin, windows)
- Checksums present

```bash
gh release view v{{version}} --json assets --jq '.assets[].name'
```
"""

[[steps]]
id = "verify-npm"
title = "Verify npm package"
needs = ["await-ci"]
description = """
Confirm npm package published.

```bash
npm show @beads/bd version
```

Should show {{version}}.

Also check: https://www.npmjs.com/package/@beads/bd

Note: npm registry may have a small propagation delay (1-2 min).
"""

[[steps]]
id = "verify-pypi"
title = "Verify PyPI package"
needs = ["await-ci"]
description = """
Confirm PyPI package published.

```bash
pip index versions beads-mcp 2>/dev/null | head -3
```

Or check: https://pypi.org/project/beads-mcp/

Should show {{version}}.

Note: PyPI may have a small propagation delay (1-2 min).
"""

[[steps]]
id = "verify-homebrew-core"
title = "Verify Homebrew core formula"
needs = ["await-ci"]
description = """
Confirm Homebrew core has the stable formula update.

Release candidates are not published to Homebrew. If `{{version}}` contains a
hyphen, record that Homebrew intentionally remains on the latest stable release
and skip the rest of this step.

Stable releases:

1. Check whether Homebrew already opened the canonical bump PR:
   ```bash
   gh pr list \
     --repo Homebrew/homebrew-core \
     --search "beads {{version}} in:title" \
     --state all
   ```

2. If a BrewTestBot or `brew bump-formula-pr` PR already exists, track that PR.
   Do not open a duplicate manual PR. Do not push to the PR branch before
   Homebrew's bottle commits are pushed.

3. If no PR exists, open it with Homebrew's bump tool:
   ```bash
   brew bump-formula-pr \
     --url="https://github.com/gastownhall/beads/archive/refs/tags/v{{version}}.tar.gz" \
     beads
   ```

   This computes the source checksum and lets Homebrew/BrewTestBot manage the
   bottle block. Do not remove or hand-edit the bottle block.

4. If a manual PR is unavoidable, fill in Homebrew's current PR template before
   opening or editing the PR:
   ```bash
   gh api repos/Homebrew/homebrew-core/contents/.github/PULL_REQUEST_TEMPLATE.md \
     -H 'Accept: application/vnd.github.raw'
   ```

   Do not leave the checklist/body blank. An incomplete or stale template causes
   Homebrew automation to close the PR.

5. Verify the merged formula on `Homebrew/homebrew-core@main`:
   ```bash
   gh api '/repos/Homebrew/homebrew-core/contents/Formula/b/beads.rb?ref=main' \
     -H 'Accept: application/vnd.github.raw' | tee /tmp/homebrew-beads.rb

   grep -F 'homepage "https://github.com/gastownhall/beads"' /tmp/homebrew-beads.rb
   grep -F 'url "https://github.com/gastownhall/beads/archive/refs/tags/v{{version}}.tar.gz"' /tmp/homebrew-beads.rb
   grep -F 'bottle do' /tmp/homebrew-beads.rb
   ```

6. Record the merged Homebrew PR on the release tracker. If a duplicate manual
   PR was closed by Homebrew automation after the canonical PR merged, leave it
   closed and note which PR is canonical.
"""

# =============================================================================
# Phase 3: Installation (Fan-in)
# =============================================================================

[[steps]]
id = "local-install"
title = "Update local installation"
needs = ["verify-github", "verify-npm", "verify-pypi", "verify-homebrew-core"]
description = """
Update local bd to the new version.

Step 1: Install release binary

Option A - Homebrew:
```bash
brew upgrade beads
```

Option B - Install script:
```bash
curl -fsSL https://raw.githubusercontent.com/gastownhall/beads/main/scripts/install.sh | bash
```

Step 2: Check for dev builds (developers only)

If you build bd from source, you may have multiple `bd` binaries in your PATH:
```bash
which -a bd
```

Common locations:
- `~/.local/bin/bd` - release binary (installed above)
- `~/go/bin/bd` - Go dev build
- Project worktree builds

If you have a dev build that takes precedence, rebuild from source:
```bash
# From the beads source directory
make install

# Or using go install directly
go install -ldflags="-X main.Build=$(git rev-parse --short HEAD)" ./cmd/bd
```

Verify ALL bd binaries are updated:
```bash
# Check which bd runs by default
which bd && bd --version

# If you have go/bin/bd, verify it too
test -f ~/go/bin/bd && ~/go/bin/bd --version
```

All should show {{version}}.
"""

[[steps]]
id = "cleanup-stale-dolt-orphans"
title = "Clean up stale Dolt orphans"
needs = ["local-install"]
description = """
Clean up orphaned local Dolt server processes left behind by older bd runs.
The active canonical server, embedded mode, and external Dolt hosts are left alone.

```bash
STATUS_JSON=$(bd dolt status --json 2>/dev/null) || {
  echo "Could not query Dolt status."
  bd dolt status
  exit 1
}
MODE=$(printf "%s\n" "$STATUS_JSON" | sed -n 's/.*"mode"[[:space:]]*:[[:space:]]*"\\([^"]*\\)".*/\\1/p' | head -1)
case "$MODE" in
  embedded)
    echo "Embedded Dolt mode; no server restart needed."
    ;;
  external)
    echo "External Dolt mode; no local orphan cleanup needed."
    ;;
  "")
    if ! printf "%s\n" "$STATUS_JSON" | grep -Eq '"(running|data_dir)"[[:space:]]*:'; then
      echo "Dolt status JSON did not identify a mode or local server state."
      bd dolt status
      exit 1
    fi
    bd dolt killall
    ;;
  *)
    echo "Unrecognized Dolt mode: $MODE"
    bd dolt status
    exit 1
    ;;
esac
```

This step only reaps orphaned local Dolt processes. It does not stop the
canonical active server.

Verify:
```bash
bd dolt status
```
"""

[[steps]]
id = "generate-newsletter"
title = "Generate release newsletter"
needs = ["push-tag"]
description = """
Generate a narrative newsletter summarizing this release.

The newsletter generator aggregates changelog, commits, new commands, and
breaking changes into a narrative format suitable for users.

```bash
# Generate newsletter for this release
uv run scripts/generate-newsletter.py --to-release v{{version}}

# Or specify the range explicitly (e.g., from last release)
PREV_TAG=$(git describe --tags --abbrev=0 v{{version}}^)
uv run scripts/generate-newsletter.py --from-release $PREV_TAG --to-release v{{version}}
```

The script outputs to NEWSLETTER.md by default. Review and commit if desired.

Note: This step can run in parallel with verification steps since it only
needs the tag to exist, not the CI artifacts.
"""

[[steps]]
