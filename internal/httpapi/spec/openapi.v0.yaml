        # --- repeated from Issue (see the pinned-schema note above) ---
        id: { type: string }
        title: { type: string }
        description: { type: string }
        design: { type: string }
        acceptance_criteria: { type: string }
        notes: { type: string }
        spec_id: { type: string }
