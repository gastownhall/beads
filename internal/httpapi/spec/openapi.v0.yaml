        title:
          type: string
          minLength: 1
          maxLength: 255
          description: The issue's title. Must not be blank after trimming.
        description:
          type: string
        design:
          type: string
        acceptance_criteria:
          type: string
        notes:
          type: string
        issue_type:
          type: string
          maxLength: 255
